<style>
body{margin:0;background:#FFFFFF}
*{box-sizing:border-box}
a{color:#1F5D5A}a:hover{color:#17494A}
:focus-visible{outline:3px solid #F0862B;outline-offset:3px;border-radius:6px}
a[href="#inhoud"]:focus{top:12px!important}
button{font:inherit}
.l-h{font-family:'Outfit',system-ui,sans-serif;font-weight:700;letter-spacing:-0.025em;line-height:1.05;margin:0;color:#1B2A2A;text-wrap:balance}
.l-or{color:#F0862B}
.l-label{font:700 12px/1.3 'Figtree',system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#1F5D5A}
.l-bar{width:56px;height:4px;border-radius:4px;background:#F0862B}
.l-btn{display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:0 26px;border-radius:12px;font:600 16px/1 'Figtree',system-ui,sans-serif;text-decoration:none;border:0;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),background .2s ease,box-shadow .25s ease,color .2s ease}
.l-btn:hover{transform:translateY(-2px)}
.l-btn-primary{background:#1F5D5A;color:#FFFFFF}.l-btn-primary:hover{background:#17494A;color:#FFFFFF;box-shadow:0 14px 28px -14px rgba(31,93,90,.6)}
.l-btn-orange{background:#F0862B;color:#FFFFFF}.l-btn-orange:hover{background:#DB7620;color:#FFFFFF}
.l-btn-outline{background:#FFFFFF;border:1.5px solid #F0862B;color:#C96A1A}.l-btn-outline:hover{background:#FFF4EA;color:#C96A1A}
.l-card{background:#FAF7F2;border:1px solid #EAE2D6;border-radius:18px;padding:clamp(24px,3vw,36px);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease}
.l-card:hover{transform:translateY(-4px);box-shadow:0 24px 44px -28px rgba(31,93,90,.4)}
.l-num{flex:none;width:44px;height:44px;border-radius:50%;background:#F0862B;color:#FFFFFF;display:grid;place-items:center;font:700 19px 'Outfit',sans-serif}
.l-photo{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(135deg,#DCEFEA 0%,#F3EDE4 60%,#FBE3CC 100%);display:grid;place-items:center;min-height:260px;aspect-ratio:4/3;max-width:100%}
.l-photo span{position:absolute;left:16px;bottom:16px;z-index:1;background:rgba(255,255,255,.9);border:1.5px dashed #F0862B;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:#8A4A12;max-width:calc(100% - 32px)}
.l-photo svg{opacity:.6}
.l-tabs{display:flex;flex-wrap:wrap;gap:8px}
.l-tabs button{min-height:48px;padding:0 20px;border:1.5px solid #D7CFC2;border-radius:12px;background:#FFFFFF;color:#1F5D5A;font-weight:600;font-size:15px;cursor:pointer;transition:background .2s ease,color .2s ease,border-color .2s ease,transform .25s cubic-bezier(.2,.8,.2,1)}
.l-tabs button:hover{border-color:#1F5D5A;transform:translateY(-2px)}
.l-tabs button[aria-selected="true"]{background:#1F5D5A;color:#FFFFFF;border-color:#1F5D5A}
.l-panel{animation:l-fade .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes l-fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.l-mark{background:#FBE3CC;color:#8A4A12;border:1.5px dashed #F0862B;border-radius:8px;padding:1px 8px;font-size:13px;font-weight:600}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details{border:1px solid #EAE2D6;border-radius:14px;background:#FFFFFF}
details[open]{border-color:#F0862B}
details[open] .l-plus{transform:rotate(45deg);background:#F0862B;color:#fff}
.l-plus{flex:none;width:34px;height:34px;border-radius:50%;background:#E7F3F0;color:#1F5D5A;display:grid;place-items:center;font-size:22px;transition:transform .25s cubic-bezier(.2,.8,.2,1),background .2s ease}
.l-check{display:flex;gap:12px;line-height:1.55}
.l-check svg{flex:none;margin-top:3px}
.l-w{display:inline-block;animation:l-up .8s cubic-bezier(.2,.8,.2,1) both}
.l-w:nth-child(2){animation-delay:.06s}.l-w:nth-child(3){animation-delay:.12s}.l-w:nth-child(4){animation-delay:.18s}.l-w:nth-child(5){animation-delay:.24s}.l-w:nth-child(6){animation-delay:.3s}
@keyframes l-up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.l-fade{animation:l-fade .9s .35s cubic-bezier(.2,.8,.2,1) both}
@supports (animation-timeline: view()){.l-rv{animation:l-rise linear both;animation-timeline:view();animation-range:entry 5% entry 35%}@keyframes l-rise{from{opacity:.15;transform:translateY(28px)}to{opacity:1;transform:none}}}

/* @site-css */
/* ==========================================================================
   Verbind&GO — gedeelde designlaag v3 ("ultra modern")
   Bron: design/site.css · wordt met tools/sync_css.py in elke pagina gezet.
   Basis blijft: wit/warm wit, petrol #1F5D5A, oranje #F0862B, Outfit + Figtree.
   ========================================================================== */
:root{
  --ink:#0F1F1F;--ink-2:#4F6260;--bg:#FFFFFF;--bg-2:#F7F4EE;--bg-band:#E9F4F1;
  --petrol:#1F5D5A;--petrol-2:#17494A;--petrol-deep:#0D3534;--teal:#2BB3A3;--teal-2:#9FD3C8;
  --orange:#F0862B;--orange-2:#DB7620;--coral:#F0862B;--violet:#8A5BB5;
  --line:rgba(15,31,31,.08);--line-2:rgba(15,31,31,.14);
  --r-s:14px;--r-m:20px;--r-l:28px;--r-xl:36px;
  --sh-1:0 1px 2px rgba(15,31,31,.04),0 10px 30px -24px rgba(15,31,31,.25);
  --sh-2:0 2px 4px rgba(15,31,31,.05),0 30px 60px -32px rgba(31,93,90,.45);
  --ease:cubic-bezier(.2,.8,.2,1);
}
html{scroll-behavior:smooth}
body{background:var(--bg)}
::selection{background:#FBE3CC;color:#5C2A0E}

/* --- typografie --- */
.l-h{font-weight:800;letter-spacing:-0.04em;line-height:1.06;color:var(--ink)}
h1.l-h{letter-spacing:-0.05em;line-height:1.04}
.l-w{padding-bottom:.06em;margin-bottom:-.06em;line-height:1.1}
.l-or{color:var(--orange);background:none;-webkit-text-fill-color:var(--orange)}
.l-gr{color:var(--petrol);-webkit-text-fill-color:var(--petrol)}
.l-label{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:12px;letter-spacing:.18em;color:var(--petrol)}
.l-label::before{content:"";width:22px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--orange),var(--teal))}
.l-bar{width:64px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--orange),var(--teal) 60%,var(--petrol))}
main p{text-wrap:pretty}

/* --- knoppen --- */
.l-btn{border-radius:999px;min-height:56px;padding:0 28px;font-weight:600;letter-spacing:-0.005em;box-shadow:none;position:relative;overflow:hidden;isolation:isolate}
.l-btn svg{transition:transform .3s var(--ease)}
.l-btn:hover svg{transform:translateX(4px)}
.l-btn-primary{background:var(--petrol-deep);color:#FFFFFF;box-shadow:0 14px 30px -16px rgba(13,53,52,.8)}
.l-btn-primary::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(135deg,#2A7A74,var(--petrol) 55%,var(--petrol-deep));opacity:1;transition:opacity .3s ease}
.l-btn-primary:hover{color:#FFFFFF;transform:translateY(-2px);box-shadow:0 22px 40px -18px rgba(13,53,52,.9)}
.l-btn-primary:hover::before{opacity:.85}
.l-btn-orange{background:var(--orange);color:#FFFFFF;box-shadow:0 14px 30px -16px rgba(240,134,43,.9)}
.l-btn-orange:hover{background:var(--orange-2);color:#FFFFFF;transform:translateY(-2px);box-shadow:0 22px 40px -18px rgba(240,134,43,.95)}
.l-btn-outline{background:rgba(255,255,255,.7);border:1.5px solid var(--line-2);color:var(--petrol);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.l-btn-outline:hover{border-color:var(--petrol);background:#FFFFFF;color:var(--petrol);transform:translateY(-2px)}
.l-btn-glass{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.35);color:#FFFFFF;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.l-btn-glass:hover{background:rgba(255,255,255,.2);border-color:#FFFFFF;color:#FFFFFF;transform:translateY(-2px)}
.l-submit{border-radius:999px;background:var(--orange);box-shadow:0 14px 30px -16px rgba(240,134,43,.9)}
.l-submit:hover{background:var(--orange-2)}

/* --- kaarten en vlakken --- */
.l-card{background:#FFFFFF;border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1);transition:transform .4s var(--ease),box-shadow .4s ease,border-color .3s ease}
.l-card:hover{transform:translateY(-6px);box-shadow:var(--sh-2);border-color:rgba(43,179,163,.45)}
.l-icon{width:64px;height:64px;border-radius:20px;background:linear-gradient(145deg,#E9F4F1,#FFFFFF);border:1px solid rgba(31,93,90,.12);box-shadow:inset 0 1px 0 #FFFFFF,0 8px 18px -12px rgba(31,93,90,.5);color:var(--petrol)}
.l-icon::before{width:14px;height:14px;right:-4px;top:-4px;background:var(--orange);box-shadow:0 0 0 3px #FFFFFF}
.l-num{background:var(--orange);box-shadow:0 10px 18px -8px rgba(240,134,43,.7)}
.l-photo{border-radius:var(--r-l);background:linear-gradient(135deg,#D6EFEA 0%,#F4EFE6 55%,#FBE3CC 100%);box-shadow:inset 0 0 0 1px rgba(31,93,90,.08),0 40px 70px -48px rgba(31,93,90,.55)}
.l-photo::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(31,93,90,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(31,93,90,.07) 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(70% 70% at 50% 50%,#000 30%,transparent 100%);-webkit-mask-image:radial-gradient(70% 70% at 50% 50%,#000 30%,transparent 100%)}
.l-photo::after{content:"";position:absolute;width:60%;aspect-ratio:1;right:-20%;top:-25%;border-radius:50%;background:radial-gradient(circle,rgba(43,179,163,.35),transparent 65%);filter:blur(30px)}
.l-photo span{border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:1}
.l-chip{border-radius:999px;background:rgba(255,255,255,.8);border:1.5px solid rgba(240,134,43,.5)}
.l-mark,.lf-mark{border-radius:999px}

/* --- hero --- */
.l-hero{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(180deg,#F7F4EE 0%,#FFFFFF 100%);padding-top:92px}
.lh{margin-bottom:-92px}
main > section:first-child:not(.l-hero){padding-top:92px}
.l-hero::before,.l-hero::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(70px);pointer-events:none}
.l-hero::before{width:min(64vw,760px);aspect-ratio:1;right:-14vw;top:-32%;background:radial-gradient(circle at 40% 40%,rgba(43,179,163,.34),rgba(31,93,90,.12) 45%,transparent 70%);animation:l-drift 18s ease-in-out infinite alternate}
.l-hero::after{width:min(42vw,480px);aspect-ratio:1;left:-10vw;bottom:-36%;background:radial-gradient(circle at 50% 50%,rgba(240,134,43,.26),transparent 65%);animation:l-drift 22s ease-in-out infinite alternate-reverse}
@keyframes l-drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-4%,6%,0) scale(1.08)}}
.l-hero .l-label{padding:9px 14px 9px 10px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid rgba(31,93,90,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 1px 2px rgba(15,31,31,.05)}
.l-hero .l-label::before{width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px rgba(240,134,43,.2)}
.l-hero h1.l-h{font-size:clamp(44px,6.6vw,92px)}
.l-hero .l-tile .l-label{display:block;padding:0;border:0;background:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;letter-spacing:.16em;font-size:11px}
.l-hero .l-tile .l-label::before{display:none}
.l-float{position:absolute;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;border-radius:999px;background:rgba(255,255,255,.86);border:1px solid rgba(31,93,90,.12);box-shadow:0 14px 30px -18px rgba(15,31,31,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap;animation:l-float 6s ease-in-out infinite}
.l-float i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#E9F4F1,#CFE9E3);color:var(--petrol);flex:none}
.l-float.o i{background:linear-gradient(135deg,#FBE3CC,#F7B57E);color:#8A4A12}
@keyframes l-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (max-width:640px){.l-float{display:none}}
.l-tag{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px 0 10px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(31,93,90,.14);color:var(--petrol);font-weight:600;font-size:14px;text-decoration:none;transition:background .2s ease,border-color .2s ease,transform .25s var(--ease)}
.l-tag i{width:8px;height:8px;border-radius:50%;background:var(--teal)}
.l-tag:hover{background:#FFFFFF;border-color:var(--petrol);transform:translateY(-1px)}

/* bento in de hero */
.l-bento{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:auto auto;gap:14px;min-width:0}
.l-b-photo{grid-row:1/3;min-height:380px;aspect-ratio:auto}
.l-tile{border-radius:24px;padding:18px 18px 16px;background:rgba(255,255,255,.86);border:1px solid rgba(31,93,90,.12);box-shadow:var(--sh-1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0;transition:transform .4s var(--ease),box-shadow .4s ease}
.l-tile:hover{transform:translateY(-4px);box-shadow:var(--sh-2)}
.l-tile-dark{background:linear-gradient(145deg,#276E6A,var(--petrol) 60%,var(--petrol-deep));color:#FFFFFF;border-color:transparent}
.l-mini{display:grid;grid-template-columns:minmax(78px,auto) 1fr;gap:10px;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink);margin-top:7px}
.l-mini div{height:8px;border-radius:999px;background:#F1EBE1;overflow:hidden}
.l-mini i{display:block;height:100%;border-radius:999px}
@media (max-width:640px){.l-bento{grid-template-columns:1fr}.l-b-photo{grid-row:auto;min-height:240px}}

/* --- marquee met diensten --- */
.l-marq{position:relative;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.l-marq ul{list-style:none;margin:0;padding:0;display:flex;gap:10px;width:max-content;animation:l-marq 38s linear infinite}
.l-marq:hover ul,.l-marq:focus-within ul{animation-play-state:paused}
.l-marq li{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:0 18px 0 12px;border-radius:999px;border:1px solid var(--line);background:#FFFFFF;font-weight:600;font-size:15px;color:var(--petrol);white-space:nowrap}
.l-marq li svg{color:var(--orange);flex:none}
@keyframes l-marq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.l-marq{mask-image:none;-webkit-mask-image:none}.l-marq ul{animation:none;flex-wrap:wrap;width:auto;justify-content:center}}

/* --- secties --- */
main > section[style*="#E7F3F0"]{background:radial-gradient(80% 60% at 100% 0%,rgba(43,179,163,.16),transparent 60%),radial-gradient(60% 50% at 0% 100%,rgba(240,134,43,.10),transparent 60%),var(--bg-band)!important}
main > section[style*="#FAF7F2"]:not(.l-hero):not(.l-dark){background:var(--bg-2)!important}
.l-dark.l-dark{background:linear-gradient(135deg,#1C5B58 0%,#124645 50%,var(--petrol-deep) 100%)!important}
main > section[style*="background:#1F5D5A"],.l-dark,.l-cta{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(135deg,#1C5B58 0%,#124645 50%,var(--petrol-deep) 100%)!important;color:#FFFFFF}
main > section[style*="background:#1F5D5A"]::before,.l-dark::before,.l-cta::before{content:"";position:absolute;z-index:-1;width:min(60vw,640px);aspect-ratio:1;right:-10vw;top:-50%;border-radius:50%;background:radial-gradient(circle,rgba(43,179,163,.5),transparent 65%);filter:blur(40px)}
main > section[style*="background:#1F5D5A"]::after,.l-dark::after,.l-cta::after{content:"";position:absolute;z-index:-1;width:min(40vw,420px);aspect-ratio:1;left:-8vw;bottom:-60%;border-radius:50%;background:radial-gradient(circle,rgba(240,134,43,.38),transparent 65%);filter:blur(40px)}
.l-dark .l-h,main > section[style*="background:#1F5D5A"] .l-h{color:#FFFFFF}
.l-dark .l-label,main > section[style*="background:#1F5D5A"] .l-label{color:var(--teal-2)}
.l-dark .l-card{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:#FFFFFF;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.l-dark .l-card:hover{border-color:rgba(159,211,200,.6)}
.l-dark .l-card .l-h{color:#FFFFFF}
.l-dark .l-card p,.l-dark .l-dlist span{color:#D6EAE5}
.l-dark p[style*="#4F6260"],.l-dark span[style*="#4F6260"]{color:#D6EAE5!important}
.l-dark .l-dlist strong{color:#FFFFFF}
.l-dark .l-label::before{background:linear-gradient(90deg,var(--orange),var(--teal-2))}
.l-dark .l-dlist li{border-color:rgba(255,255,255,.12)}
.l-grain{position:relative}
.l-grain::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.8'/></svg>")}

/* --- homepagina-onderdelen --- */
.l-strip{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 26px;justify-content:center}
.l-strip li{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:14px;color:var(--petrol);padding:6px 0}
.l-strip svg{color:var(--orange);flex:none}
.l-grid2{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.l-aud{grid-column:span 4;padding:0;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:var(--ink)}
.l-dienst{grid-column:span 4;background:#FFFFFF}
@media (max-width:1080px){.l-aud{grid-column:span 6}.l-dienst{grid-column:span 12}}
@media (max-width:720px){.l-aud,.l-dienst{grid-column:span 12}}
.l-aud-photo{position:relative;min-height:180px;background:linear-gradient(135deg,#D6EFEA,#F4EFE6 70%,#FBE3CC);display:grid;place-items:start start;padding:14px;overflow:hidden}
.l-aud-photo.o{background:linear-gradient(135deg,#FBE3CC,#F4EFE6 60%,#D6EFEA)}

DC.register("Werkgevers",{"tpl": "<div style=\"font-family:'Figtree',system-ui,sans-serif;color:#1B2A2A;background:#FFFFFF;overflow-x:clip\">\n<dc-import name=\"Header\" active=\"werkgevers\" hint-size=\"100%,80px\"><\/dc-import>\n<main id=\"inhoud\">\n\n<section class=\"l-hero\" aria-labelledby=\"wg-title\" style=\"background:#FAF7F2\">\n<div style=\"max-width:1280px;margin:0 auto;padding:clamp(48px,6vw,88px) max(20px,4vw) clamp(56px,7vw,96px);display:flex;flex-wrap:wrap;gap:40px 56px;align-items:center\">\n<div style=\"flex:1 1 420px;min-width:0\">\n<p class=\"l-label l-fade\" style=\"margin:0 0 20px;animation-delay:.05s\">Voor werkgevers<\/p>\n<h1 id=\"wg-title\" class=\"l-h\" style=\"font-size:clamp(40px,5.6vw,70px);max-width:13ch\"><span class=\"l-w\">Een<\/span> <span class=\"l-w\">goede<\/span> <span class=\"l-w\">start<\/span> <span class=\"l-w\">is<\/span> <span class=\"l-w\">pas<\/span> <span class=\"l-w l-or\">het begin.<\/span><\/h1>\n<p class=\"l-fade\" style=\"margin:22px 0 0;max-width:52ch;font-size:18px;line-height:1.6;color:#4F6260\">U heeft een gemotiveerde nieuwe medewerker gevonden. Nu wilt u dat het werk goed gaat, en blijft gaan. Wij helpen uw medewerker met werktaal en begeleiding, en ondersteunen u en uw leidinggevenden bij duidelijke communicatie en goede afspraken.<\/p>\n<div class=\"l-fade\" style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:30px\"><a class=\"l-btn l-btn-primary\" href=\"contact.html\">Plan een kennismaking <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8h10M9 4l4 4-4 4\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/a><a class=\"l-btn l-btn-outline\" href=\"#voorbeelden\">Bekijk voorbeelden<\/a><\/div>\n<\/div>\n<div class=\"l-fade\" style=\"flex:1 1 380px;min-width:0;animation-delay:.2s\"><div class=\"l-art\" role=\"img\" aria-label=\"Illustratie: leidinggevende en nieuwe medewerker verbonden via werkafs acity=\"0.43\" stroke-width=\"1.4\"/><path d=\"M510 135.0 C 360 129.0, 310 233.8, 240 230.8\" fill=\"none\" stroke=\"#F0862B\" stroke-opacity=\"0.37\" stroke-width=\"1.4\"/><path d=\"M510 140.0 C 360 132.0, 310 235.0, 240 231.0\" fill=\"none\" stroke=\"#F0862B\" stroke-opacity=\"0.31\" stroke-width=\"1.4\"/><path d=\"M510 120 C 360 120, 310 230, 240 230\" fill=\"none\" stroke=\"#F0862B\" stroke-width=\"3\" stroke-linecap=\"round\" filter=\"url(#iwglow)\"/><path class=\"l-flow\" d=\"M510 120 C 360 120, 310 230, 240 230\" fill=\"none\" stroke=\"#FFFFFF\" stroke-opacity=\".8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><circle cx=\"240\" cy=\"230\" r=\"33.6\" fill=\"#FFFFFF\" fill-opacity=\".22\" filter=\"url(#iwsoft)\"/><circle cx=\"240\" cy=\"230\" r=\"26\" fill=\"none\" stroke=\"#FFFFFF\" stroke-opacity=\".35\"/><circle cx=\"240\" cy=\"230\" r=\"16\" fill=\"#FFFFFF\" filter=\"url(#iwglow)\"/><path transform=\"translate(240 230) scale(1.1)\" d=\"M-4.5 0l3 3l6-6.5\" fill=\"none\" stroke=\"#1F5D5A\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"105\" cy=\"120\" r=\"30\" fill=\"#2BB3A3\" filter=\"url(#iwglow)\"/><g transform=\"translate(105 122) scale(1.1)\" fill=\"none\" stroke=\"#0B2E2D\" stroke-width=\"2.3\" stroke-linecap=\"round\"><circle cx=\"0\" cy=\"-6\" r=\"5.5\"/><path d=\"M-10 11c1.5-6 5.5-9 10-9s8.5 3 10 9\"/><\/g><g filter=\"url(#iwsh)\"><rect x=\"42.300000000000004\" y=\"162\" width=\"125.39999999999999\" height=\"26\" rx=\"13\" fill=\"#FFFFFF\"/><\/g><text x=\"105\" y=\"179.5\" text-anchor=\"middle\" font-family=\"Outfit, Figtree, system-ui, sans-serif\" font-size=\"12.5\" font-weight=\"600\" fill=\"#0F1F1F\">Leidinggevende<\/text><circle cx=\"375\" cy=\"120\" r=\"30\" fill=\"#F0862B\" filter=\"url(#iwglow)\"/><g transform=\"translate(375 122) scale(1.1)\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.3\" stroke-linecap=\"round\"><circle cx=\"0\" cy=\"-6\" r=\"5.5\"/><path d=\"M-10 11c1.5-6 5.5-9 10-9s8.5 3 10 9\"/><\/g><g filter=\"url(#iwsh)\"><rect x=\"301.65\" y=\"162\" width=\"146.7\" height=\"26\" rx=\"13\" fill=\"#FFFFFF\"/><\/g><text x=\"375\" y=\"179.5\" text-anchor=\"middle\" font-family=\"Outfit, Figtree, system-ui, sans-serif\" font-size=\"12.5\" font-weight=\"600\" fill=\"#0F1F1F\">Nieuwe medewerker<\/text><g filter=\"url(#iwsh)\"><rect x=\"150\" y=\"266\" width=\"180\" height=\"70\" rx=\"16\" fill=\"#FFFFFF\"/><\/g><text x=\"166\" y=\"288\" font-family=\"Outfit, Figtree, system-ui, sans-serif\" font-size=\"10\" font-weight=\"700\" letter-spacing=\"1.2\" fill=\"#1F5D5A\">WERKAFSPRAKEN<\/text><circle cx=\"171\" cy=\"304\" r=\"6\" fill=\"#2BB3A3\"/><path transform=\"translate(171 304) scale(0.7)\" d=\"M-4.5 0l3 3l6-6.5\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"184\" y=\"300.5\" width=\"110\" height=\"7\" rx=\"3.5\" fill=\"#1F5D5A\" fill-opacity=\"0.7\"/><circle cx=\"171\" cy=\"320\" r=\"6\" fill=\"#2BB3A3\"/><path transform=\"translate(171 320) scale(0.7)\" d=\"M-4.5 0l3 3l6-6.5\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"184\" y=\"316.5\" width=\"84\" height=\"7\" rx=\"3.5\" fill=\"#1F5D5A\" fill-opacity=\"0.39999999999999997\"/><\/svg><\/div><\/div>\n<\/div>\n<\/section>\n\n<!-- DRIE WINSTPUNTEN -->\n<section aria-labelledby=\"hulp-title\" style=\"background:#FFFFFF\">\n<div style=\"max-width:1280px;margin:0 auto;padding:clamp(64px,8vw,96px) max(20px,4vw)\">\n<div class=\"l-rv\" style=\"text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:36px\"><h2 id=\"hulp-title\" class=\"l-h\" style=\"font-size:clamp(30px,4vw,46px)\">Waar we bij helpen<\/h2><div class=\"l-bar\" aria-hidden=\"true\"><\/div><\/div>\n<div class=\"l-rv\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px\">\n<div class=\"l-card\"><span class=\"l-num\">1<\/span><h3 class=\"l-h\" style=\"font-size:22px;margin:16px 0 10px\">Beter inwerken<\/h3><p style=\"margin:0 0 12px;line-height:1.6;color:#4F6260\">We oefenen met de taal en situaties van uw werkplek. Zo begrijpt uw medewerker sneller wat er wordt gevraagd.<\/p><ul style=\"margin:0;padding:0 0 0 18px;line-height:1.6;color:#4F6260\"><li>Uw instructies en werkbriefjes als lesmateriaal<\/li><li>Veiligheidswoorden en vaktermen oefenen<\/li><li>Vragen leren stellen als iets niet duidelijk is<\/li><\/ul><\/div>\n<div class=\"l-card\"><span class=\"l-num\">2<\/span><h3 class=\"l-h\" style=\"font-size:22px;margin:16px 0 10px\">Duidelijkere communicatie<\/h3><p style=\"margin:0 0 12px;line-height:1.6;color:#4F6260\">Misverstanden ontstaan aan twee kanten. We geven leidinggevenden praktische tips en begeleiden het gesprek als het schuurt.<\/p><ul style=\"margin:0;padding:0 0 0 18px;line-height:1.6;color:#4F6260\"><li>Instructies kort en controleerbaar geven<\/li><li>Verwachtingen over en weer uitspreken<\/li><li>Driegesprekken met medewerker en leidinggevende<\/li><\/ul><\/div>\n<div class=\"l-card\"><span class=\"l-num\">3<\/span><h3 class=\"l-h\" style=\"font-size:22px;margin:16px 0 10px\">Medewerkers behouden<\/h3><p style=\"margin:0 0 12px;line-height:1.6;color:#4F6260\">Knelpunten die vroeg op tafel komen, zijn vaak op te lossen. We blijven betrokken, ook na de eerste weken.<\/p><ul style=\"margin:0;padding:0 0 0 18px;line-height:1.6;color:#4F6260\"><li>Vaste contactmomenten en evaluaties<\/li><li>Op tijd bijsturen als iets niet lukt<\/li><li>Nazorg volgens afspraak<\/li><\/ul><\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- SITUATIEKIEZER -->\n<section aria-labelledby=\"sit-title\" style=\"background:#E7F3F0\">\n<div style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,7vw,88px) max(20px,4vw)\">\n<div class=\"l-rv\" style=\"display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between;align-items:flex-end;margin-bottom:28px\">\n<div><h2 id=\"sit-title\" class=\"l-h\" style=\"font-size:clamp(30px,4vw,46px)\">Kies de situatie die bij u past<\/h2><div class=\"l-bar\" style=\"margin-top:14px\" aria-hidden=\"true\"><\/div><\/div>\n<p style=\"margin:0;max-width:44ch;color:#4F6260;line-height:1.6\">Elke situatie vraagt een andere mix van taal, coaching en begeleiding. Klik en zie wat we doen.<\/p>\n<\/div>\n<div class=\"l-rv l-tabs\" role=\"tablist\" aria-label=\"Situaties\"><sc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"4\"><button type=\"button\" role=\"tab\" aria-selected=\"{{t.selected}}\" onClick=\"{{t.pick}}\">{{t.label}}<\/button><\/sc-for><\/div>\n<div class=\"l-rv\" style=\"margin-top:18px;display:flex;flex-wrap:wrap;gap:18px\">\n<div class=\"l-panel\" style=\"flex:1 1 380px;min-width:0;background:#1F5D5A;color:#FFFFFF;border-radius:18px;padding:clamp(24px,3.4vw,40px)\">\n<p class=\"l-label\" style=\"margin:0 0 12px;color:#9FD3C8\">Situatie<\/p>\n<h3 class=\"l-h\" style=\"font-size:clamp(24px,2.6vw,32px);color:#FFFFFF;margin-bottom:14px\">{{cur.kop}}<\/h3>\n<p style=\"margin:0;line-height:1.65;color:#D6EAE5\">{{cur.situatie}}<\/p>\n<\/div>\n<div class=\"l-panel\" style=\"flex:1 1 380px;min-width:0;background:#FFFFFF;border:1px solid #EAE2D6;border-radius:18px;padding:clamp(24px,3.4vw,40px);display:flex;flex-direction:column;gap:14px\">\n<p class=\"l-label\" style=\"margin:0\">Wat we doen<\/p>\n<ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;line-height:1.55\"><sc-for list=\"{{cur.acties}}\" as=\"a\" hint-placeholder-count=\"3\"><li style=\"display:flex;gap:12px\"><span class=\"l-num\" style=\"width:30px;height:30px;font-size:14px\">{{a.n}}<\/span><span>{{a.tekst}}<\/span><\/li><\/sc-for><\/ul>\n<p style=\"margin:auto 0 0;padding-top:12px;border-top:1px solid #EAE2D6;color:#4F6260;font-size:15px;line-height:1.5\">{{cur.wgRol}}<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- VOORBEELDEN -->\n<section id=\"voorbeelden\" aria-labelledby=\"vb-title\" style=\"background:#FFFFFF\">\n<div style=\"max-width:1280px;margin:0 auto;padding:clamp(64px,8vw,96px) max(20px,4vw)\">\n<div class=\"l-rv\" style=\"text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:36px\"><h2 id=\"vb-title\" class=\"l-h\" style=\"font-size:clamp(30px,4vw,46px)\">Zo kan begeleiding eruitzien<\/h2><div class=\"l-bar\" aria-hidden=\"true\"><\/div><p style=\"margin:0;max-width:56ch;color:#4F6260;line-height:1.6\">Drie voorbeelden ter illustratie, geen klantverhalen. Ze laten zien hoe we begeleiding afstemmen op de situatie.<\/p><\/div>\n<div class=\"l-rv\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px\">\n<article class=\"l-card\"><p class=\"l-label\" style=\"margin:0 0 10px;color:#C96A1A\">Logistiek<\/p><h3 class=\"l-h\" style=\"font-size:21px;margin-bottom:12px\">Een orderpicker die instructies nog niet altijd begrijpt<\/h3><p style=\"margin:0 0 10px;line-height:1.6\"><strong>Situatie.<\/strong> Een nieuwe medewerker werkt hard, maar knikt ook bij instructies die niet duidelijk zijn. Er gaan kleine dingen mis met de scanner.<\/p><p style=\"margin:0;line-height:1.6;color:#4F6260\"><strong style=\"color:#1B2A2A\">Wat we doen.<\/strong> Oefenen met de echte instructiekaarten en veiligheidswoorden. Een werkplekbezoek. Afspraak met de teamleider: nieuwe taken voordoen en kort op papier geven.<\/p><\/article>\n<article class=\"l-card\"><p class=\"l-label\" style=\"margin:0 0 10px;color:#C96A1A\">Facilitair<\/p><h3 class=\"l-h\" style=\"font-size:21px;margin-bottom:12px\">Een schoonmaakmedewerker die vastloopt op etiketten en werkbriefjes<\/h3><p style=\"margin:0 0 10px;line-height:1.6\"><strong>Situatie.<\/strong> De medewerker praat makkelijk, maar leest productetiketten en werkbriefjes nog niet goed. Vragen stellen voelt lastig.<\/p><p style=\"margin:0;line-height:1.6;color:#4F6260\"><strong style=\"color:#1B2A2A\">Wat we doen.<\/strong> Korte vaktaalopdrachten met de middelen van de werkplek. Een driegesprek over wanneer en hoe je iets meldt.<\/p><\/article>\n<article class=\"l-card\"><p class=\"l-label\" style=\"margin:0 0 10px;color:#C96A1A\">Zonder taalvraag<\/p><h3 class=\"l-h\" style=\"font-size:21px;margin-bottom:12px\">Een medewerker die na lange tijd weer gaat werken<\/h3><p style=\"margin:0 0 10px;line-height:1.6\"><strong>Situatie.<\/strong> De medewerker spreekt vloeiend Nederlands, maar moet weer wennen aan een vast ritme en aan feedback krijgen.<\/p><p style=\"margin:0;line-height:1.6;color:#4F6260\"><strong style=\"color:#1B2A2A\">Wat we doen.<\/strong> Coaching op planning en werkritme. Afspraken met de leidinggevende over feedback. Evalueren na de eerste weken.<\/p><\/article>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- TAAKVERDELING -->\n<section aria-labelledby=\"rol-title\" style=\"background:#FAF7F2\">\n<div style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,7vw,88px) max(20px,4vw)\">\n<div class=\"l-rv\" style=\"text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:36px\"><h2 id=\"rol-title\" class=\"l-h\" style=\"font-size:clamp(30px,4vw,46px)\">Wat wij doen, en wat u zelf bijdraagt<\/h2><div class=\"l-bar\" aria-hidden=\"true\"><\/div><\/div>\n<div class=\"l-rv\" style=\"display:flex;flex-wrap:wrap;gap:18px\">\n<div style=\"flex:1 1 360px;min-width:0;background:#1F5D5A;color:#FFFFFF;border-radius:18px;padding:clamp(24px,3.4vw,40px)\"><h3 class=\"l-h\" style=\"font-size:24px;color:#FFFFFF;margin-bottom:18px\">Verbind<span class=\"l-or\">&amp;<\/span>GO<\/h3><ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;color:#D6EAE5\">\n<li class=\"l-check\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"#F0862B\"/><path d=\"M6 10l3 3 5-6\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>Kennismaken met uw medewerker en uw werkplek<\/li>\n<li class=\"l-check\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"#F0862B\"/><path d=\"M6 10l3 3 5-6\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>Een plan met werkgerichte doelen opstellen<\/li>\n<li class=\"l-check\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"#F0862B\"/><path d=\"M6 10l3 3 5-6\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>Werktaal, vaktaal en vaardigheden trainen<\/li>\n<li class=\"l-check\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"#F0862B\"/><path d=\"M6 10l3 3 5-6\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>Op of naast de werkvloer begeleiden<\/li>\n<li class=\"l-check\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"#F0862B\"/><path d=\"M6 10l3 3 5-6\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>Driegesprekken en evaluaties voorbereiden en leiden<\/li>\n<li class=\"l-check\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"#F0862B\"/><path d=\"M6 10l3 3 5-6\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>Afstemmen met andere betrokkenen, zoals de gemeente<\/li>\n<\/ul><\/div>\n<div style=\"flex:1 1 360px;min-width:0;background:#FFFFFF;border:1px solid #EAE2D6;border-radius:18px;padding:clamp(24px,3.4vw,40px)\"><h3 class=\"l-h\" style=\"font-size:24px;margin-bottom:18px;color:#C96A1A\">U als werkgever<\/h3><ul style=\"margin:0;padding:0;list-sty troke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>Afspraken nakomen, net als wij<\/li>\n<\/ul><\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- FAQ -->\n<section aria-labelledby=\"faq-title\" style=\"background:#FFFFFF\">\n<div style=\"max-width:1280px;margin:0 auto;padding:clamp(64px,8vw,96px) max(20px,4vw);display:flex;flex-wrap:wrap;gap:40px\">\n<div class=\"l-rv\" style=\"flex:1 1 280px;min-width:0\"><h2 id=\"faq-title\" class=\"l-h\" style=\"font-size:clamp(30px,4vw,44px)\">Veelgestelde vragen<\/h2><div class=\"l-bar\" style=\"margin:14px 0 16px\" aria-hidden=\"true\"><\/div><p style=\"margin:0;color:#4F6260;line-height:1.6;max-width:36ch\">Staat uw vraag er niet bij? Stel hem in het eerste gesprek.<\/p><a class=\"l-btn l-btn-primary\" href=\"contact.html\" style=\"margin-top:22px\">Plan een kennismaking<\/a><\/div>\n<div class=\"l-rv\" style=\"flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:10px\">\n<details><summary style=\"display:flex;justify-content:space-between;gap:16px;align-items:center;min-height:64px;font-size:17px;font-weight:600;padding:12px 16px 12px 22px\">Wat kost begeleiding?<span class=\"l-plus\" aria-hidden=\"true\">+<\/span><\/summary><p style=\"margin:0;padding:0 22px 22px;line-height:1.65;max-width:65ch\">Dat hangt af van de vraag en van wat we samen afspreken. Na de kennismaking krijgt u een voorstel op maat. Soms zijn er mogelijkheden voor financiering via de gemeente of andere regelingen; dat bespreken we per situatie. <mark class=\"l-mark\">IN TE VULLEN: informatie over tarieven en financiering<\/mark><\/p><\/details>\n<details><summary style=\"display:flex;justify-content:space-between;gap:16px;align-items:center;min-height:64px;font-size:17px;font-weight:600;padding:12px 16px 12px 22px\">Hoe lang duurt een traject?<span class=\"l-plus\" aria-hidden=\"true\">+<\/span><\/summary><p style=\"margin:0;padding:0 22px 22px;line-height:1.65;max-width:65ch\">Dat stemmen we af op de doelen. In het voorstel staat wanneer we evalueren. Op dat moment kijken we samen of we doorgaan, bijstellen of afronden.<\/p><\/details>\n<details><summary style=\"display:flex;justify-content:space-between;gap:16px;align-items:center;min-height:64px;font-size:17px;font-weight:600;padding:12px 16px 12px 22px\">Moet mijn medewerker anderstalig zijn?<span class=\"l-plus\" aria-hidden=\"true\">+<\/span><\/summary><p style=\"margin:0;padding:0 22px 22px;line-height:1.65;max-width:65ch\">Nee. Taalondersteuning is één van onze diensten. Veel begeleidingsvragen gaan over iets anders, zoals werkritme, samenwerking of verwachtingen.<\/p><\/details>\n<details><summary style=\"display:flex;justify-content:space-between;gap:16px;align-items:center;min-height:64px;font-size:17px;font-weight:600;padding:12px 16px 12px 22px\">Welke informatie krijg ik over mijn medewerker?<span class=\"l-plus\" aria-hidden=\"true\">+<\/span><\/summary><p style=\"margin:0;padding:0 22px 22px;line-height:1.65;max-width:65ch\">Alleen wat nodig is voor het werk en wat vooraf met de medewerker is afgesproken, zoals werkafspraken, werkdoelen en evaluaties. Persoonlijke gesprekken en interne notities delen we niet.<\/p><\/details>\n<details><summary style=\"display:flex;justify-content:space-between;gap:16px;align-items:center;min-height:64px;font-size:17px;font-weight:600;padding:12px 16px 12px 22px\">En als er problemen zijn buiten het werk?<span class=\"l-plus\" aria-hidden=\"true\">+<\/span><\/summary><p style=\"margin:0;padding:0 22px 22px;line-height:1.65;max-width:65ch\">Wij zijn geen zorgverlener of schuldhulpverlener. Als er andere hulp nodig is, bespreken we dat met de medewerker en denken we mee over wie kan helpen.<\/p><\/details>\n<\/div>\n<\/div>\n<\/section>\n\n<section aria-labelledby=\"wg-cta\" style=\"background:#1F5D5A;color:#FFFFFF\">\n<div style=\"max-width:1280px;margin:0 auto;padding:clamp(48px,6vw,72px) max(20px,4vw);display:flex;flex-wrap:wrap;gap:24px 48px;align-items:center;justify-content:space-between\">\n<div

<style>
body{margin:0;background:#FFFFFF}
*{box-sizing:border-box}
a{color:#1F5D5A}a:hover{color:#17494A}
:focus-visible{outline:3px solid #F0862B;outline-offset:3px;border-radius:6px}
a[href="#inhoud"]:focus{top:12px!important}
input,textarea,select,button{font:inherit}
.l-h{font-family:'Outfit',system-ui,sans-serif;font-weight:700;letter-spacing:-0.025em;line-height:1.05;margin:0;color:#1B2A2A;text-wrap:balance}
.l-or{color:#F0862B}
.l-label{font:700 12px/1.3 'Figtree',system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#1F5D5A}
.l-bar{width:56px;height:4px;border-radius:4px;background:#F0862B}
.l-card{background:#FFFFFF;border:1px solid #EAE2D6;border-radius:18px}
.l-mark{background:#FBE3CC;color:#8A4A12;border:1.5px dashed #F0862B;border-radius:8px;padding:1px 8px;font-size:13px;font-weight:600}
input[type=text],input[type=email],input[type=tel],textarea{width:100%;min-height:52px;padding:12px 16px;border-radius:12px;border:1.5px solid #D7CFC2;background:#FFFFFF;color:#1B2A2A;transition:border-color .2s ease,box-shadow .2s ease}
input:focus-visible,textarea:focus-visible{outline:0;border-color:#1F5D5A;box-shadow:0 0 0 4px rgba(31,93,90,.15)}
textarea{resize:vertical}
.l-choice{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:12px;border:1.5px solid #D7CFC2;background:#FFFFFF;cursor:pointer;min-height:60px;transition:border-color .2s ease,background .2s ease}
.l-choice:hover{border-color:#1F5D5A}
.l-choice:has(input:checked){border-color:#1F5D5A;background:#E7F3F0}
.l-choice input{width:20px;height:20px;margin:2px 0 0;accent-color:#1F5D5A;flex:none}
.l-prog{height:8px;border-radius:999px;background:#EAE2D6;overflow:hidden}
.l-prog i{display:block;height:100%;background:#F0862B;border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.l-submit{display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:0 26px;border-radius:12px;border:0;background:#F0862B;color:#FFFFFF;font-weight:600;font-size:16px;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),background .2s ease}
.l-submit:hover{transform:translateY(-2px);background:#DB7620}
.l-err{color:#B42318;font-weight:600;font-size:14px;margin:8px 0 0}
.l-bad{border-color:#B42318!important;border-width:2px!important}
.l-copy{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:8px;border:1.5px solid rgba(255,255,255,.4);background:transparent;color:#FFFFFF;font-size:13px;font-weight:600;cursor:pointer}
.l-copy:hover{border-color:#F0862B;color:#FBE3CC}
.l-done{animation:l-fade .45s cubic-bezier(.2,.8,.2,1) both}
.l-fade{animation:l-fade .9s .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes l-fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.l-w{display:inline-block;animation:l-up .8s cubic-bezier(.2,.8,.2,1) both}
.l-w:nth-child(2){animation-delay:.06s}.l-w:nth-child(3){animation-delay:.12s}
@keyframes l-up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* @site-css */
/* ==========================================================================
   Verbind&GO — gedeelde designlaag v3 ("ultra modern")
   Bron: design/site.css · wordt met tools/sync_css.py in elke pagina gezet.
   Basis blijft: wit/warm wit, petrol #1F5D5A, oranje #F0862B, Outfit + Figtree.
   ========================================================================== */
:root{
  --ink:#0F1F1F;--ink-2:#4F6260;--bg:#FFFFFF;--bg-2:#F7F4EE;--bg-band:#E9F4F1;
  --petrol:#1F5D5A;--petrol-2:#17494A;--petrol-deep:#0D3534;--teal:#2BB3A3;--teal-2:#9FD3C8;
  --orange:#F0862B;--orange-2:#DB7620;--coral:#F0862B;--violet:#8A5BB5;
  --line:rgba(15,31,31,.08);--line-2:rgba(15,31,31,.14);
  --r-s:14px;--r-m:20px;--r-l:28px;--r-xl:36px;
  --sh-1:0 1px 2px rgba(15,31,31,.04),0 10px 30px -24px rgba(15,31,31,.25);
  --sh-2:0 2px 4px rgba(15,31,31,.05),0 30px 60px -32px rgba(31,93,90,.45);
  --ease:cubic-bezier(.2,.8,.2,1);
}
html{scroll-behavior:smooth}
body{background:var(--bg)}
::selection{background:#FBE3CC;color:#5C2A0E}

/* --- typografie --- */
.l-h{font-weight:800;letter-spacing:-0.04em;line-height:1.06;color:var(--ink)}
h1.l-h{letter-spacing:-0.05em;line-height:1.04}
.l-w{padding-bottom:.06em;margin-bottom:-.06em;line-height:1.1}
.l-or{color:var(--orange);background:none;-webkit-text-fill-color:var(--orange)}
.l-gr{color:var(--petrol);-webkit-text-fill-color:var(--petrol)}
.l-label{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:12px;letter-spacing:.18em;color:var(--petrol)}
.l-label::before{content:"";width:22px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--orange),var(--teal))}
.l-bar{width:64px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--orange),var(--teal) 60%,var(--petrol))}
main p{text-wrap:pretty}

/* --- knoppen --- */
.l-btn{border-radius:999px;min-height:56px;padding:0 28px;font-weight:600;letter-spacing:-0.005em;box-shadow:none;position:relative;overflow:hidden;isolation:isolate}
.l-btn svg{transition:transform .3s var(--ease)}
.l-btn:hover svg{transform:translateX(4px)}
.l-btn-primary{background:var(--petrol-deep);color:#FFFFFF;box-shadow:0 14px 30px -16px rgba(13,53,52,.8)}
.l-btn-primary::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(135deg,#2A7A74,var(--petrol) 55%,var(--petrol-deep));opacity:1;transition:opacity .3s ease}
.l-btn-primary:hover{color:#FFFFFF;transform:translateY(-2px);box-shadow:0 22px 40px -18px rgba(13,53,52,.9)}
.l-btn-primary:hover::before{opacity:.85}
.l-btn-orange{background:var(--orange);color:#FFFFFF;box-shadow:0 14px 30px -16px rgba(240,134,43,.9)}
.l-btn-orange:hover{background:var(--orange-2);color:#FFFFFF;transform:translateY(-2px);box-shadow:0 22px 40px -18px rgba(240,134,43,.95)}
.l-btn-outline{background:rgba(255,255,255,.7);border:1.5px solid var(--line-2);color:var(--petrol);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.l-btn-outline:hover{border-color:var(--petrol);background:#FFFFFF;color:var(--petrol);transform:translateY(-2px)}
.l-btn-glass{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.35);color:#FFFFFF;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.l-btn-glass:hover{background:rgba(255,255,255,.2);border-color:#FFFFFF;color:#FFFFFF;transform:translateY(-2px)}
.l-submit{border-radius:999px;background:var(--orange);box-shadow:0 14px 30px -16px rgba(240,134,43,.9)}
.l-submit:hover{background:var(--orange-2)}

/* --- kaarten en vlakken --- */
.l-card{background:#FFFFFF;border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1);transition:transform .4s var(--ease),box-shadow .4s ease,border-color .3s ease}
.l-card:hover{transform:translateY(-6px);box-shadow:var(--sh-2);border-color:rgba(43,179,163,.45)}
.l-icon{width:64px;height:64px;border-radius:20px;background:linear-gradient(145deg,#E9F4F1,#FFFFFF);border:1px solid rgba(31,93,90,.12);box-shadow:inset 0 1px 0 #FFFFFF,0 8px 18px -12px rgba(31,93,90,.5);color:var(--petrol)}
.l-icon::before{width:14px;height:14px;right:-4px;top:-4px;background:var(--orange);box-shadow:0 0 0 3px #FFFFFF}
.l-num{background:var(--orange);box-shadow:0 10px 18px -8px rgba(240,134,43,.7)}
.l-photo{border-radius:var(--r-l);background:linear-gradient(135deg,#D6EFEA 0%,#F4EFE6 55%,#FBE3CC 100%);box-shadow:inset 0 0 0 1px rgba(31,93,90,.08),0 40px 70px -48px rgba(31,93,90,.55)}
.l-photo::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(31,93,90,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(31,93,90,.07) 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(70% 70% at 50% 50%,#000 30%,transparent 100%);-webkit-mask-image:radial-gradient(70% 70% at 50% 50%,#000 30%,transparent 100%)}
.l-photo::after{content:"";position:absolute;width:60%;aspect-ratio:1;right:-20%;top:-25%;border-radius:50%;background:radial-gradient(circle,rgba(43,179,163,.35),transparent 65%);filter:blur(30px)}
.l-photo span{border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:1}
.l-chip{border-radius:999px;background:rgba(255,255,255,.8);border:1.5px solid rgba(240,134,43,.5)}
.l-mark,.lf-mark{border-radius:999px}

/* --- hero --- */
.l-hero{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(180deg,#F7F4EE 0%,#FFFFFF 100%);padding-top:92px}
.lh{margin-bottom:-92px}
main > section:first-child:not(.l-hero){padding-top:92px}
.l-hero::before,.l-hero::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(70px);pointer-events:none}
.l-hero::before{width:min(64vw,760px);aspect-ratio:1;right:-14vw;top:-32%;background:radial-gradient(circle at 40% 40%,rgba(43,179,163,.34),rgba(31,93,90,.12) 45%,transparent 70%);animation:l-drift 18s ease-in-out infinite alternate}
.l-hero::after{width:min(42vw,480px);aspect-ratio:1;left:-10vw;bottom:-36%;background:radial-gradient(circle at 50% 50%,rgba(240,134,43,.26),transparent 65%);animation:l-drift 22s ease-in-out infinite alternate-reverse}
@keyframes l-drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-4%,6%,0) scale(1.08)}}
.l-hero .l-label{padding:9px 14px 9px 10px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid rgba(31,93,90,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 1px 2px rgba(15,31,31,.05)}
.l-hero .l-label::before{width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px rgba(240,134,43,.2)}
.l-hero h1.l-h{font-size:clamp(44px,6.6vw,92px)}
.l-hero .l-tile .l-label{display:block;padding:0;border:0;background:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;letter-spacing:.16em;font-size:11px}
.l-hero .l-tile .l-label::before{display:none}
.l-float{position:absolute;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;border-radius:999px;background:rgba(255,255,255,.86);border:1px solid rgba(31,93,90,.12);box-shadow:0 14px 30px -18px rgba(15,31,31,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap;animation:l-float 6s ease-in-out infinite}
.l-float i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#E9F4F1,#CFE9E3);color:var(--petrol);flex:none}
.l-float.o i{background:linear-gradient(135deg,#FBE3CC,#F7B57E);color:#8A4A12}
@keyframes l-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (max-width:640px){.l-float{display:none}}
.l-tag{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px 0 10px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(31,93,90,.14);color:var(--petrol);font-weight:600;font-size:14px;text-decoration:none;transition:background .2s ease,border-color .2s ease,transform .25s var(--ease)}
.l-tag i{width:8px;height:8px;border-radius:50%;background:var(--teal)}
.l-tag:hover{background:#FFFFFF;border-color:var(--petrol);transform:translateY(-1px)}

/* bento in de hero */
.l-bento{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:auto auto;gap:14px;min-width:0}
.l-b-photo{grid-row:1/3;min-height:380px;aspect-ratio:auto}
.l-tile{border-radius:24px;padding:18px 18px 16px;background:rgba(255,255,255,.86);border:1px solid rgba(31,93,90,.12);box-shadow:var(--sh-1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0;transition:transform .4s var(--ease),box-shadow .4s ease}
.l-tile:hover{transform:translateY(-4px);box-shadow:var(--sh-2)}
.l-tile-dark{background:linear-gradient(145deg,#276E6A,var(--petrol) 60%,var(--petrol-deep));color:#FFFFFF;border-color:transparent}
.l-mini{display:grid;grid-template-columns:minmax(78px,auto) 1fr;gap:10px;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink);margin-top:7px}
.l-mini div{height:8px;border-radius:999px;background:#F1EBE1;overflow:hidden}
.l-mini i{display:block;height:100%;border-radius:999px}
@media (max-width:640px){.l-bento{grid-template-columns:1fr}.l-b-photo{grid-row:auto;min-height:240px}}

/* --- marquee met diensten --- */
.l-marq{position:relative;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.l-marq ul{list-style:none;margin:0;padding:0;display:flex;gap:10px;width:max-content;animation:l-marq 38s linear infinite}
.l-marq:hover ul,.l-marq:focus-within ul{animation-play-state:paused}
.l-marq li{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:0 18px 0 12px;border-radius:999px;border:1px solid var(--line);background:#FFFFFF;font-weight:600;font-size:15px;color:var(--petrol);white-space:nowrap}
.l-marq li svg{color:var(--orange);flex:none}
@keyframes l-marq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.l-marq{mask-image:none;-webkit-mask-image:none}.l-marq ul{animation:none;flex-wrap:wrap;width:auto;justify-content:center}}

/* --- secties --- */
main > section[style*="#E7F3F0"]{background:radial-gradient(80% 60% at 100% 0%,rgba(43,179,163,.16),transparent 60%),radial-gradient(60% 50% at 0% 100%,rgba(240,134,43,.10),transparent 60%),var(--bg-band)!important}
main > section[style*="#FAF7F2"]:not(.l-hero):not(.l-dark){background:var(--bg-2)!important}
.l-dark.l-dark{background:linear-gradient(135deg,#1C5B58 0%,#124645 50%,var(--petrol-deep) 100%)!important}
main > section[style*="background:#1F5D5A"],.l-dark,.l-cta{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(135deg,#1C5B58 0%,#124645 50%,var(--petrol-deep) 100%)!important;color:#FFFFFF}
main > section[style*="background:#1F5D5A"]::before,.l-dark::before,.l-cta::before{content:"";position:absolute;z-index:-1;width:min(60vw,640px);aspect-ratio:1;right:-10vw;top:-50%;border-radius:50%;background:radial-gradient(circle,rgba(43,179,163,.5),transparent 65%);filter:blur(40px)}
main > section[style*="background:#1F5D5A"]::after,.l-dark::after,.l-cta::after{content:"";position:absolute;z-index:-1;width:min(40vw,420px);aspect-ratio:1;left:-8vw;bottom:-60%;border-radius:50%;background:radial-gradient(circle,rgba(240,134,43,.38),transparent 65%);filter:blur(40px)}
.l-dark .l-h,main > section[style*="background:#1F5D5A"] .l-h{color:#FFFFFF}
.l-dark .l-label,main > section[style*="background:#1F5D5A"] .l-label{color:var(--teal-2)}
.l-dark .l-card{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:#FFFFFF;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.l-dark .l-card:hover{border-color:rgba(159,211,200,.6)}
.l-dark .l-card .l-h{color:#FFFFFF}
.l-dark .l-card p,.l-dark .l-dlist span{color:#D6EAE5}
.l-dark p[style*="#4F6260"],.l-dark span[style*="#4F6260"]{color:#D6EAE5!important}
.l-dark .l-dlist strong{color:#FFFFFF}
.l-dark .l-label::before{background:linear-gradient(90deg,var(--orange),var(--teal-2))}
.l-dark .l-dlist li{border-color:rgba(255,255,255,.12)}
.l-grain{position:relative}
.l-grain::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.8'/></svg>")}

/* --- homepagina-onderdelen --- */
.l-strip{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 26px;justify-content:center}
.l-strip li{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:14px;color:var(--petrol);padding:6px 0}
.l-strip svg{color:var(--orange);flex:none}
.l-grid2{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.l-aud{grid-column:span 4;padding:0;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:var(--ink)}
.l-dienst{grid-column:span 4;background:#FFFFFF}
@media (max-width:1080px){.l-aud{grid-column:span 6}.l-dienst{grid-column:span 12}}
@media (max-width:720px){.l-aud,.l-dienst{grid-column:span 12}}
.l-aud-photo{position:relative;min-height:180px;background:linear-gradient(135deg,#D6EFEA,#F4EFE6 70%,#FBE3CC);display:grid;place-items:start start;padding:14px;overflow:hidden}
.l-aud-photo.o{background:linear-gradient(135deg,#FBE3CC,#F4EFE6 60%,#D6EFEA)}
.l-aud-photo.v{background:linear-gradient(135deg,#E6DDF2,#F4EFE6 60%,#D6EFEA)}
.l-aud-photo::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(31,93,90,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(31,93,90,.07) 1px,transparent 1px);background-size:24px 24px;mask-image:radial-gradient(80% 80% at 50% 50%,#000 20%,transparent 100%);-webkit-mask-image:radial-gradient(80% 80% at 50% 50%,#000 20%,transparent 100%)}
.l-aud-photo span{position:relative;background:rgba(255,255,255,.9);border:1.5px dashed var(--orange);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:#8A4A12}
.l-aud-body{padding:clamp(22px,3vw,30px);display:flex;flex-direction:column;gap:12px;flex:1}
.l-aud .l-icon{width:56px;height:56px;border-radius:16px;margin-top:-50px;background:#FFFFFF;position:relative;z-index:1}
.l-more{display:inline-flex;align-items:center;gap:8px;margin-top:auto;font-weight:700;color:var(--orange-2);text-decoration:none;min-height:44px}
.l-more svg{transition:transform .3s var(--ease)}
.l-aud:hover .l-more svg,.l-more:hover svg{transform:translateX(4px)}
.l-dlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.l-dlist li{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-top:1px solid #F1EBE1;line-height:1.45}
.l-dlist li:first-child{border-top:0}
.l-dlist strong{font-size:15.5px}
.l-dlist span{font-size:14px;color:var(--ink-2)}
.l-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:20px;position:relative}
.l-steps::before{content:"";position:absolute;left:24px;right:24px;top:24px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--orange),var(--teal) 50%,var(--petrol))}

<\/sc-if>\n\n<sc-if value=\"{{sent}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"l-done\" role=\"status\" style=\"background:#1F5D5A;color:#FFFFFF;border-radius:14px;padding:clamp(22px,3.4vw,36px)\">\n<p class=\"l-label\" style=\"margin:0 0 10px;color:#9FD3C8\">Verzonden<\/p>\n<h2 class=\"l-h\" style=\"margin-bottom:10px;font-size:28px;color:#FFFFFF\">Bedankt, uw bericht is verstuurd.<\/h2>\n<p style=\"margin:0 0 18px;line-height:1.6;color:#D6EAE5;max-width:56ch\">We nemen zo snel mogelijk contact met u op om een eerste gesprek te plannen. U ontvangt geen automatische kopie van dit bericht.<\/p>\n<dl style=\"margin:0 0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;font-size:15px\">\n<div><dt class=\"l-label\" style=\"color:#9FD3C8\">Naam<\/dt><dd style=\"margin:4px 0 0\">{{f.naam}}<\/dd><\/div>\n<div><dt class=\"l-label\" style=\"color:#9FD3C8\">Type aanvraag<\/dt><dd style=\"margin:4px 0 0\">{{typeLabel}}<\/dd><\/div>\n<div><dt class=\"l-label\" style=\"color:#9FD3C8\">Contact<\/dt><dd style=\"margin:4px 0 0\">{{contactLine}}<\/dd><\/div>\n<\/dl>\n<button type=\"button\" onClick=\"{{reset}}\" class=\"l-copy\" style=\"min-height:44px;padding:0 18px;font-size:15px\">Nog een bericht sturen<\/button>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{done}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"l-done\" role=\"status\" style=\"background:#1F5D5A;color:#FFFFFF;border-radius:14px;padding:clamp(22px,3.4vw,36px)\">\n<p class=\"l-label\" style=\"margin:0 0 10px;color:#F7B57E\">Niet verzonden<\/p>\n<h2 class=\"l-h\" style=\"margin-bottom:10px;font-size:28px;color:#FFFFFF\">Uw bericht is niet verstuurd.<\/h2>\n<p style=\"margin:0 0 18px;line-height:1.6;color:#D6EAE5;max-width:56ch\">Het formulier is correct ingevuld, maar het is nog niet gekoppeld aan een mailbox of systeem. Neem voorlopig rechtstreeks contact op via <a href=\"mailto:info@verbindengo.nl\" style=\"color:inherit;font-weight:600\">info@verbindengo.nl<\/a>.<\/p>\n<dl style=\"margin:0 0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;font-size:15px\">\n<div><dt class=\"l-label\" style=\"color:#9FD3C8\">Naam<\/dt><dd style=\"margin:4px 0 0\">{{f.naam}}<\/dd><\/div>\n<div><dt class=\"l-label\" style=\"color:#9FD3C8\">Type aanvraag<\/dt><dd style=\"margin:4px 0 0\">{{typeLabel}}<\/dd><\/div>\n<div><dt class=\"l-label\" style=\"color:#9FD3C8\">Contact<\/dt><dd style=\"margin:4px 0 0\">{{contactLine}}<\/dd><\/div>\n<\/dl>\n<button type=\"button\" onClick=\"{{reset}}\" class=\"l-copy\" style=\"min-height:44px;padding:0 18px;font-size:15px\">Formulier opnieuw invullen<\/button>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{showForm}}\" hint-placeholder-val=\"{{ true }}\">\n<sc-if value=\"{{sendErr}}\" hint-placeholder-val=\"{{ false }}\"><div role=\"alert\" style=\"border:2px solid #B42318;background:#FDECEA;color:#7A1A12;border-radius:12px;padding:16px 18px;margin-bottom:18px;line-height:1.5\"><strong>Versturen is niet gelukt.<\/strong> Controleer uw internetverbinding en probeer het opnieuw. Lukt het weer niet, neem dan rechtstreeks contact op via de gegevens naast het formulier.<\/div><\/sc-if>\n<div style=\"display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px\"><span class=\"l-label\" style=\"color:#4F6260\">Ingevuld<\/span><span class=\"l-label\">{{pct}}%<\/span><\/div>\n<div class=\"l-prog\" style=\"margin-bottom:26px\"><i style=\"width:{{pct}}%\"><\/i><\/div>\n<form onSubmit=\"{{submit}}\" novalidate=\"novalidate\" style=\"display:flex;flex-direction:column;gap:26px\">\n<sc-if value=\"{{hasErrors}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"alert\" style=\"border:2px solid #B42318;background:#FDECEA;color:#7A1A12;border-radius:12px;padding:16px 18px\"><p style=\"margin:0 0 8px;font-weight:700\">Controleer het formulier. Er {{errorCountText}}.<\/p><ul style=\"margin:0;padding-left:20px;line-height:1.6\"><sc-for list=\"{{errorList}}\" as=\"fout\" hint-placeholder-count=\"2\"><li><a href=\"{{fout.href}}\" style=\"color:#7A1A12\">{{fout.msg}}<\/a><\/li><\/sc-for><\/ul><\/div>\n<\/sc-if>\n<fieldset style=\"border:0;margin:0;padding:0\">\n<legend style=\"font-weight:700;font-size:17px;margin-bottom:12px\">Waarover wilt u contact? <span style=\"font-weight:400;color:#4F6260\">(verplicht)<\/span><\/legend>\n<div id=\"veld-type\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px\"><sc-for list=\"{{types}}\" as=\"t\" hint-placeholder-count=\"3\"><label class=\"l-choice\"><input type=\"radio\" name=\"type\" value=\"{{t.id}}\" checked=\"{{t.checked}}\" onChange=\"{{t.pick}}\"/><span><strong style=\"display:block\">{{t.label}}<\/strong><span style=\"font-size:14px;color:#4F6260\">{{t.desc}}<\/span><\/span><\/label><\/sc-for><\/div>\n<sc-if value=\"{{e.type}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"l-err\">{{msg.type}}<\/p><\/sc-if>\n<\/fieldset>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px\">\n<div><label for=\"veld-naam\" style=\"display:block;font-weight:600;margin-bottom:8px\">Naam <span style=\"font-weight:400;color:#4F6260\">(verplicht)<\/span><\/label><input id=\"veld-naam\" type=\"text\" autocomplete=\"name\" value=\"{{f.naam}}\" onChange=\"{{on.naam}}\" aria-invalid=\"{{inv.naam}}\" class=\"{{cls.naam}}\" maxlength=\"120\"/><sc-if value=\"{{e.naam}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"l-err\">{{msg.naam}}<\/p><\/sc-if><\/div>\n<div><label for=\"veld-org\" style=\"display:block;font-weight:600;margin-bottom:8px\">Organisatie<\/label><input id=\"veld-org\" type=\"text\" autocomplete=\"organization\" value=\"{{f.org}}\" onChange=\"{{on.org}}\" maxlength=\"160\"/><\/div>\n<div><label for=\"veld-email\" style=\"display:block;font-weight:600;margin-bottom:8px\">E-mailadres<\/label><input id=\"veld-email\" type=\"email\" autocomplete=\"email\" value=\"{{f.email}}\" onChange=\"{{on.email}}\" aria-invalid=\"{{inv.email}}\" aria-describedby=\"hint-contact\" class=\"{{cls.email}}\" maxlength=\"200\"/><sc-if value=\"{{e.email}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"l-err\">{{msg.email}}<\/p><\/sc-if><\/div>\n<div><label for=\"veld-tel\" style=\"display:block;font-weight:600;margin-bottom:8px\">Telefoonnummer<\/label><input id=\"veld-tel\" type=\"tel\" autocomplete=\"tel\" value=\"{{f.tel}}\" onChange=\"{{on.tel}}\" aria-describedby=\"hint-contact\" maxlength=\"40\"/><\/div>\n<\/div>\n<p id=\"hint-contact\" style=\"margin:-14px 0 0;font-size:15px;color:#4F6260\">Vul een e-mailadres of telefoonnummer in, zodat we u kunnen bereiken.<\/p>\n<div>\n<label for=\"veld-tekst\" style=\"display:block;font-weight:600;margin-bottom:8px\">Korte toelichting <span style=\"font-weight:400;color:#4F6260\">(niet verplicht)<\/span><\/label>\n<p id=\"hint-tekst\" style=\"margin:0 0 10px;font-size:15px;color:#4F6260;line-height:1.5\">Schrijf in een paar zinnen waar u hulp bij zoekt. Deel hier geen gevoelige gegevens of dossierinformatie over medewerkers of inwoners.<\/p>\n<textarea id=\"veld-tekst\" rows=\"5\" maxlength=\"600\" value=\"{{f.tekst}}\" onChange=\"{{on.tekst}}\" aria-describedby=\"hint-tekst teller\" aria-invalid=\"{{inv.tekst}}\" class=\"{{cls.tekst}}\"><\/textarea>\n<div style=\"display:flex;justify-content:space-between;gap:12px;margin-top:6px\"><sc-if value=\"{{e.tekst}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"l-err\" style=\"margin:0\">{{msg.tekst}}<\/p><\/sc-if><span id=\"teller\" style=\"margin-left:auto;font-size:13px;color:#4F6260;font-weight:600\">{{count}} / 600<\/span><\/div>\n<\/div>\n<div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:center\"><button type=\"submit\" class=\"l-submit\" disabled=\"{{sendingAttr}}\" aria-busy=\"{{sendingAria}}\">{{submitLabel}} <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8h10M9 4l4 4-4 4\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/button><sc-if value=\"{{demoMode}}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:14px;color:#4F6260\">Er wordt niets verzonden.<\/span><\/sc-if><sc-if value=\"{{liveMode}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:14px;color:#4F6260\">We gebruiken uw gegevens alleen om contact op te nemen.<\/span><\/sc-if><\/div>\n<\/form>\n<\/sc-if>\n<\/div>\n\n<aside style=\"flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:16px\">\n<div style=\"background:#1F5D5A;color:#FFFFFF;border-radius:18px;padding:28px\">\n<p class=\"l-label\" style=\"margin:0 0 12px;color:#FFFFFF;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none\">Direct contact<\/p>\n<ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;line-height:1.5\">\n<li style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\"><a href=\"mailto:info@verbindengo.nl\" style=\"color:inherit;font-weight:600\">info@verbindengo.nl<\/a><button type=\"button\" class=\"l-copy\" onClick=\"{{copyMail}}\">{{copyLabel}}<\/button><\/li>\n<li><a href=\"tel:0650641099\" style=\"color:inherit;font-weight:600\">06 50 64 10 99<\/a><\/li>\n<li>ma–vr 9:00–17:00<\/li>\n<\/ul>\n<\/div>\n<div class=\"l-card\" style=\"padding:28px;background:#FFFFFF\">\n<h2 class=\"l-h\" style=\"margin-bottom:12px;font-size:21px\">Wat gebeurt er hierna?<\/h2>\n<ol style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;color:#4F6260;line-height:1.5\">\n<li style=\"display:flex;gap:12px\"><span style=\"flex:none;width:26px;height:26px;border-radius:50%;background:#F0862B;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px\">1<\/span>We nemen contact op om een eerste gesprek te plannen.<\/li>\n<li style=\"display:flex;gap:12px\"><span style=\"flex:none;width:26px;height:26px;border-radius:50%;background:#F0862B;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px\">2<\/span>In dat gesprek bespreken we uw vraag en wat nodig is.<\/li>\n<li style=\"display:flex;gap:12px\"><span style=\"flex:none;width:26px;height:26px;border-radius:50%;background:#F0862B;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px\">3<\/span>Daarna doen we een voorstel op maat.<\/li>\n<\/ol>\n<\/div>\n<div class=\"l-card\" style=\"padding:28px;background:#E7F3F0;border-color:#CFE3DE\">\n<h2 class=\"l-h\" style=\"margin-bottom:8px;font-size:21px\">Al in begeleiding?<\/h2>\n<p style=\"margin:0 0 10px;line-height:1.6;color:#4F6260\">Neem contact op met uw eigen begeleider, of log in op het portaal.<\/p>\n<a href=\"inloggen.html\" style=\"font-weight:700\">Naar het portaal →<\/a>\n<\/div>\n<\/aside>\n<\/div>\n<\/div>\n<\/section>\n<\/main>\n<dc-import name=\"Footer\" hint-size=\"100%,360px\"><\/dc-import>\n<\/div>", "props": {"$preview": {"width": 1440, "height": 2400}}, "src": "\nclass Component extends DCLogic {\nrenderVals() {\nconst EMPTY = { naam: '', org: '', email: '', tel: '', type: '', tekst: '' };\nconst TYPES = [\n{ id: 'werkgever', label: 'Ik ben werkgever', desc: 'Kennismaken of een vraag over medewerkers' },\n{ id: 'gemeente', label: 'Ik werk bij een gemeente', desc: 'Samenwerking of een opdracht bespreken' },\n{ id: 'anders', label: 'Iets anders', desc: 'Een andere vraag' }\n];\nconst st = this.state || {}; const f = st.f || EMPTY; const err = st.err || {}; const done = !!st.done;\nconst cfg = (typeof window !== 'undefined' && window.SITE_CONFIG) || {}; const endpoint = (cfg.formEndpoint || '').trim(); const live = endpoint.length > 0;\nconst sending = !!st.sending, sent = !!st.sent, sendErr = !!st.sendErr;\nconst setF = (k, v) => this.setState({ f: Object.assign({}, (this.state && this.state.f) || EMPTY, { [k]: v }) });\nconst on = {}; ['naam', 'org', 'email', 'tel', 'tekst'].forEach(k => { on[k] = e => setF(k, e.target.value); });\nconst validate = (v) => { const out = {}; if (!v.type) out.type = 'Kies waarover u contact wilt.'; if (!v.naam.trim()) out.naam = 'Vul uw naam in.'; const mail = v.email.trim(); if (!mail && !v.tel.trim()) out.email = 'Vul een e-mailadres of telefoonnummer in.'; else if (mail && !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(mail)) out.email = 'Dit e-mailadres klopt niet. Controleer of er een @ en een punt in staan, bijvoorbeeld naam@voorbeeld.nl.'; if (/(^|\\D)\\d{9}(\\D|$)/.test(v.tekst)) out.tekst = 'In de toelichting staat een nummer van 9 cijfers. Haal dit weg als het een BSN of ander persoonsnummer is.'; return out; };\nconst submit = (e) => { if (e && e.preventDefault) e.preventDefault(); if (this.state && this.state.sending) return; const cur = (this.state && this.state.f) || EMPTY; const out = validate(cur); const ok = Object.keys(out).length === 0;\nif (!ok || !live) { this.setState({ err: out, done: ok, sendErr: false }); return; }\nthis.setState({ err: {}, sending: true, sendErr: false });\nconst payload = { type: cur.type, naam: cur.naam, organisatie: cur.org, email: cur.email, telefoon: cur.tel, toelichting: cur.tekst, bron: 'website verbind-en-go', _subject: 'Nieuw contactverzoek via de website' };\nconst isSb = endpoint.indexOf('/rest/v1/') > -1; const nz = v => { const t = (v || '').trim(); return t ? t : null; };\nconst body = isSb ? { type: cur.type, naam: cur.naam.trim(), organisatie: nz(cur.org), email: nz(cur.email), telefoon: nz(cur.tel), toelichting: nz(cur.tekst) } : payload;\nconst headers = isSb ? { 'Content-Type': 'application/json', 'apikey': cfg.supabaseKey || '', 'Prefer': 'return=minimal' } : { 'Accept': 'application/json', 'Content-Type': 'application/json' };\nfetch(endpoint, { method: 'POST', headers: headers, body: JSON.stringify(body) })\n.then(r => { if (!r.ok) throw new Error('status ' + r.status); this.setState({ sending: false, sent: true }); })\n.catch(() => this.setState({ sending: false, sendErr: true })); };\nconst reset = () => this.setState({ f: EMPTY, err: {}, done: false, sent: false, sendErr: false, sending: false });\nconst order = [['type', '#veld-type'], ['naam', '#veld-naam'], ['email', '#veld-email'], ['tekst', '#veld-tekst']];\nconst errorList = order.filter(([k]) => err[k]).map(([k, href]) => ({ href, msg: err[k] }));\nconst typeObj = TYPES.find(t => t.id === f.type);\nconst filled = [f.type, f.naam.trim(), (f.email.trim() || f.tel.trim())].filter(Boolean).length;\nconst copyMail = () => { const txt = 'info@verbindengo.nl'; const ok = () => { this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 1800); }; if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok).catch(() => this.setState({ copied: false })); };\nreturn { f, on, submit, reset, done, notDone: !done, demoMode: !live, liveMode: live, sent, sendErr, showForm: !done && !sent, sendingAttr: sending ? 'disabled' : undefined, sendingAria: sending ? 'true' : undefined, submitLabel: sending ? 'Bezig met versturen…' : (live ? 'Bericht versturen' : 'Bericht controleren'), hasErrors: errorList.length > 0, errorList, errorCountText: errorList.length === 1 ? 'is 1 punt om aan te passen' : 'zijn ' + errorList.length + ' punten om aan te passen', e: { type: !!err.type, naam: !!err.naam, email: !!err.email, tekst: !!err.tekst }, msg: { type: err.type || '', naam: err.naam || '', email: err.email || '', tekst: err.tekst || '' }, inv: { naam: err.naam ? 'true' : undefined, email: err.email ? 'true' : undefined, tekst: err.tekst ? 'true' : undefined }, cls: { naam: err.naam ? 'l-bad' : '', email: err.email ? 'l-bad' : '', tekst: err.tekst ? 'l-bad' : '' }, types: TYPES.map(t => ({ ...t, checked: f.type === t.id, pick: () => setF('type', t.id) })), count: f.tekst.length, typeLabel: typeObj ? typeObj.label : '', contactLine: [f.email, f.tel].filter(Boolean).join(' · '), pct: Math.round(filled

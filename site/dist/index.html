<style>
body{margin:0;background:#FFFFFF}
*{box-sizing:border-box}
a{color:#1F5D5A}a:hover{color:#17494A}
:focus-visible{outline:3px solid #F0862B;outline-offset:3px;border-radius:6px}
a[href="#inhoud"]:focus{top:12px!important}
.l-h{font-family:'Outfit',system-ui,sans-serif;font-weight:700;letter-spacing:-0.025em;line-height:1.05;margin:0;color:#1B2A2A;text-wrap:balance}
.l-or{color:#F0862B}
.l-label{font:700 12px/1.3 'Figtree',system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#1F5D5A}
.l-bar{width:56px;height:4px;border-radius:4px;background:#F0862B}
.l-btn{display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:0 26px;border-radius:12px;font:600 16px/1 'Figtree',system-ui,sans-serif;text-decoration:none;border:0;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),background .2s ease,box-shadow .25s ease,color .2s ease}
.l-btn:hover{transform:translateY(-2px)}
.l-btn-primary{background:#1F5D5A;color:#FFFFFF}.l-btn-primary:hover{background:#17494A;color:#FFFFFF;box-shadow:0 14px 28px -14px rgba(31,93,90,.6)}
.l-btn-orange{background:#F0862B;color:#FFFFFF}.l-btn-orange:hover{background:#DB7620;color:#FFFFFF;box-shadow:0 14px 28px -14px rgba(240,134,43,.6)}
.l-btn-outline{background:#FFFFFF;border:1.5px solid #F0862B;color:#C96A1A}.l-btn-outline:hover{background:#FFF4EA;color:#C96A1A}
.l-card{background:#FAF7F2;border:1px solid #EAE2D6;border-radius:18px;padding:clamp(24px,3vw,36px);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease,border-color .25s ease}
.l-card:hover{transform:translateY(-5px);box-shadow:0 24px 44px -28px rgba(31,93,90,.4);border-color:#CFE3DE}
.l-icon{position:relative;width:64px;height:64px;display:grid;place-items:center;color:#1F5D5A}
.l-icon::before{content:"";position:absolute;right:2px;top:2px;width:26px;height:26px;border-radius:50%;background:#F7B57E;z-index:0}
.l-icon svg{position:relative;z-index:1}
.l-more{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:#C96A1A;text-decoration:none;margin-top:auto}
.l-more svg{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.l-card:hover .l-more svg{transform:translateX(5px)}
.l-num{flex:none;width:44px;height:44px;border-radius:50%;background:#F0862B;color:#FFFFFF;display:grid;place-items:center;font:700 19px 'Outfit',sans-serif}
.l-step{display:flex;flex-direction:column;gap:12px;flex:1 1 180px;min-width:0}
.l-arrow{flex:none;color:#1F5D5A;opacity:.7;align-self:center;display:none}
@media (min-width:980px){.l-arrow{display:block}}
.l-photo{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(135deg,#DCEFEA 0%,#F3EDE4 60%,#FBE3CC 100%);display:grid;place-items:center;min-height:280px;aspect-ratio:4/3;max-width:100%}
.l-photo::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 70% 30%,rgba(255,255,255,.55),transparent 70%)}
.l-photo span{position:absolute;left:16px;bottom:16px;z-index:1;background:rgba(255,255,255,.9);border:1.5px dashed #F0862B;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:#8A4A12;max-width:calc(100% - 32px)}
.l-photo svg{position:relative;z-index:1;opacity:.6}
.l-chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border:1.5px solid #F0862B;border-radius:10px;color:#C96A1A;font-weight:700;font-size:14px;background:#FFFFFF}
.l-sit{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid #EAE2D6;line-height:1.5}
.l-sit svg{flex:none;margin-top:3px}
.l-w{display:inline-block;animation:l-up .8s cubic-bezier(.2,.8,.2,1) both}
.l-w:nth-child(2){animation-delay:.06s}.l-w:nth-child(3){animation-delay:.12s}.l-w:nth-child(4){animation-delay:.18s}.l-w:nth-child(5){animation-delay:.24s}.l-w:nth-child(6){animation-delay:.3s}.l-w:nth-child(7){animation-delay:.36s}
@keyframes l-up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.l-fade{animation:l-fade .9s .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes l-fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@supports (animation-timeline: view()){
.l-rv{animation:l-rise linear both;animation-timeline:view();animation-range:entry 5% entry 35%}
@keyframes l-rise{from{opacity:.15;transform:translateY(28px)}to{opacity:1;transform:none}}
}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* @site-css */
/* ==========================================================================
   Verbind&GO — gedeelde designlaag v3 ("ultra modern")
   Bron: design/site.css · wordt met tools/sync_css.py in elke pagina gezet.
   Basis blijft: wit/warm wit, petrol #1F5D5A, oranje #F0862B, Outfit + Figtree.
   ========================================================================== */
:root{
  --ink:#0F1F1F;--ink-2:#4F6260;--bg:#FFFFFF;--bg-2:#F7F4EE;--bg-band:#E9F4F1;
  --petrol:#1F5D5A;--petrol-2:#17494A;--petrol-deep:#0D3534;--teal:#2BB3A3;--teal-2:#9FD3C8;
  --orange:#F0862B;--orange-2:#DB7620;--coral:#F0862B;--violet:#8A5BB5;
  --line:rgba(15,31,31,.08);--line-2:rgba(15,31,31,.14);
  --r-s:14px;--r-m:20px;--r-l:28px;--r-xl:36px;
  --sh-1:0 1px 2px rgba(15,31,31,.04),0 10px 30px -24px rgba(15,31,31,.25);
  --sh-2:0 2px 4px rgba(15,31,31,.05),0 30px 60px -32px rgba(31,93,90,.45);
  --ease:cubic-bezier(.2,.8,.2,1);
}
html{scroll-behavior:smooth}
body{background:var(--bg)}
::selection{background:#FBE3CC;color:#5C2A0E}

/* --- typografie --- */
.l-h{font-weight:800;letter-spacing:-0.04em;line-height:1.06;color:var(--ink)}
h1.l-h{letter-spacing:-0.05em;line-height:1.04}
.l-w{padding-bottom:.06em;margin-bottom:-.06em;line-height:1.1}
.l-or{color:var(--orange);background:none;-webkit-text-fill-color:var(--orange)}
.l-gr{color:var(--petrol);-webkit-text-fill-color:var(--petrol)}
.l-label{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:12px;letter-spacing:.18em;color:var(--petrol)}
.l-label::before{content:"";width:22px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--orange),var(--teal))}
.l-bar{width:64px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--orange),var(--teal) 60%,var(--petrol))}
main p{text-wrap:pretty}

/* --- knoppen --- */
.l-btn{border-radius:999px;min-height:56px;padding:0 28px;font-weight:600;letter-spacing:-0.005em;box-shadow:none;position:relative;overflow:hidden;isolation:isolate}
.l-btn svg{transition:transform .3s var(--ease)}
.l-btn:hover svg{transform:translateX(4px)}
.l-btn-primary{background:var(--petrol-deep);color:#FFFFFF;box-shadow:0 14px 30px -16px rgba(13,53,52,.8)}
.l-btn-primary::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(135deg,#2A7A74,var(--petrol) 55%,var(--petrol-deep));opacity:1;transition:opacity .3s ease}
.l-btn-primary:hover{color:#FFFFFF;transform:translateY(-2px);box-shadow:0 22px 40px -18px rgba(13,53,52,.9)}
.l-btn-primary:hover::before{opacity:.85}
.l-btn-orange{background:var(--orange);color:#FFFFFF;box-shadow:0 14px 30px -16px rgba(240,134,43,.9)}
.l-btn-orange:hover{background:var(--orange-2);color:#FFFFFF;transform:translateY(-2px);box-shadow:0 22px 40px -18px rgba(240,134,43,.95)}
.l-btn-outline{background:rgba(255,255,255,.7);border:1.5px solid var(--line-2);color:var(--petrol);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.l-btn-outline:hover{border-color:var(--petrol);background:#FFFFFF;color:var(--petrol);transform:translateY(-2px)}
.l-btn-glass{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.35);color:#FFFFFF;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.l-btn-glass:hover{background:rgba(255,255,255,.2);border-color:#FFFFFF;color:#FFFFFF;transform:translateY(-2px)}
.l-submit{border-radius:999px;background:var(--orange);box-shadow:0 14px 30px -16px rgba(240,134,43,.9)}
.l-submit:hover{background:var(--orange-2)}

/* --- kaarten en vlakken --- */
.l-card{background:#FFFFFF;border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1);transition:transform .4s var(--ease),box-shadow .4s ease,border-color .3s ease}
.l-card:hover{transform:translateY(-6px);box-shadow:var(--sh-2);border-color:rgba(43,179,163,.45)}
.l-icon{width:64px;height:64px;border-radius:20px;background:linear-gradient(145deg,#E9F4F1,#FFFFFF);border:1px solid rgba(31,93,90,.12);box-shadow:inset 0 1px 0 #FFFFFF,0 8px 18px -12px rgba(31,93,90,.5);color:var(--petrol)}
.l-icon::before{width:14px;height:14px;right:-4px;top:-4px;background:var(--orange);box-shadow:0 0 0 3px #FFFFFF}
.l-num{background:var(--orange);box-shadow:0 10px 18px -8px rgba(240,134,43,.7)}
.l-photo{border-radius:var(--r-l);background:linear-gradient(135deg,#D6EFEA 0%,#F4EFE6 55%,#FBE3CC 100%);box-shadow:inset 0 0 0 1px rgba(31,93,90,.08),0 40px 70px -48px rgba(31,93,90,.55)}
.l-photo::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(31,93,90,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(31,93,90,.07) 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(70% 70% at 50% 50%,#000 30%,transparent 100%);-webkit-mask-image:radial-gradient(70% 70% at 50% 50%,#000 30%,transparent 100%)}
.l-photo::after{content:"";position:absolute;width:60%;aspect-ratio:1;right:-20%;top:-25%;border-radius:50%;background:radial-gradient(circle,rgba(43,179,163,.35),transparent 65%);filter:blur(30px)}
.l-photo span{border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:1}
.l-chip{border-radius:999px;background:rgba(255,255,255,.8);border:1.5px solid rgba(240,134,43,.5)}
.l-mark,.lf-mark{border-radius:999px}

/* --- hero --- */
.l-hero{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(180deg,#F7F4EE 0%,#FFFFFF 100%);padding-top:92px}
.lh{margin-bottom:-92px}
main > section:first-child:not(.l-hero){padding-top:92px}
.l-hero::before,.l-hero::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(70px);pointer-events:none}
.l-hero::before{width:min(64vw,760px);aspect-ratio:1;right:-14vw;top:-32%;background:radial-gradient(circle at 40% 40%,rgba(43,179,163,.34),rgba(31,93,90,.12) 45%,transparent 70%);animation:l-drift 18s ease-in-out infinite alternate}
.l-hero::after{width:min(42vw,480px);aspect-ratio:1;left:-10vw;bottom:-36%;background:radial-gradient(circle at 50% 50%,rgba(240,134,43,.26),transparent 65%);animation:l-drift 22s ease-in-out infinite alternate-reverse}
@keyframes l-drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-4%,6%,0) scale(1.08)}}
.l-hero .l-label{padding:9px 14px 9px 10px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid rgba(31,93,90,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 1px 2px rgba(15,31,31,.05)}
.l-hero .l-label::before{width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px rgba(240,134,43,.2)}
.l-hero h1.l-h{font-size:clamp(44px,6.6vw,92px)}
.l-hero .l-tile .l-label{display:block;padding:0;border:0;background:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;letter-spacing:.16em;font-size:11px}
.l-hero .l-tile .l-label::before{display:none}
.l-float{position:absolute;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;border-radius:999px;background:rgba(255,255,255,.86);border:1px solid rgba(31,93,90,.12);box-shadow:0 14px 30px -18px rgba(15,31,31,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap;animation:l-float 6s ease-in-out infinite}
.l-float i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#E9F4F1,#CFE9E3);color:var(--petrol);flex:none}
.l-float.o i{background:linear-gradient(135deg,#FBE3CC,#F7B57E);color:#8A4A12}
@keyframes l-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (max-width:640px){.l-float{display:none}}
.l-tag{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px 0 10px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(31,93,90,.14);color:var(--petrol);font-weight:600;font-size:14px;text-decoration:none;transition:background .2s ease,border-color .2s ease,transform .25s var(--ease)}
.l-tag i{width:8px;height:8px;border-radius:50%;background:var(--teal)}
.l-tag:hover{background:#FFFFFF;border-color:var(--petrol);transform:translateY(-1px)}

/* bento in de hero */
.l-bento{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:auto auto;gap:14px;min-width:0}
.l-b-photo{grid-row:1/3;min-height:380px;aspect-ratio:auto}
.l-tile{border-radius:24px;padding:18px 18px 16px;background:rgba(255,255,255,.86);border:1px solid rgba(31,93,90,.12);box-shadow:var(--sh-1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0;transition:transform .4s var(--ease),box-shadow .4s ease}
.l-tile:hover{transform:translateY(-4px);box-shadow:var(--sh-2)}
.l-tile-dark{background:linear-gradient(145deg,#276E6A,var(--petrol) 60%,var(--petrol-deep));color:#FFFFFF;border-color:transparent}
.l-mini{display:grid;grid-template-columns:minmax(78px,auto) 1fr;gap:10px;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink);margin-top:7px}
.l-mini div{height:8px;border-radius:999px;background:#F1EBE1;overflow:hidden}
.l-mini i{display:block;height:100%;border-radius:999px}
@media (max-width:640px){.l-bento{grid-template-columns:1fr}.l-b-photo{grid-row:auto;min-height:240px}}

/* --- marquee met diensten --- */
.l-marq{position:relative;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.l-marq ul{list-style:none;margin:0;padding:0;display:flex;gap:10px;width:max-content;animation:l-marq 38s linear infinite}
.l-marq:hover ul,.l-marq:focus-within ul{animation-play-state:paused}
.l-marq li{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:0 18px 0 12px;border-radius:999px;border:1px solid var(--line);background:#FFFFFF;font-weight:600;font-size:15px;color:var(--petrol);white-space:nowrap}
.l-marq li svg{color:var(--orange);flex:none}
@keyframes l-marq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.l-marq{mask-image:none;-webkit-mask-image:none}.l-marq ul{animation:none;flex-wrap:wrap;width:auto;justify-content:center}}

/* --- secties --- */
main > section[style*="#E7F3F0"]{background:radial-gradient(80% 60% at 100% 0%,rgba(43,179,163,.16),transparent 60%),radial-gradient(60% 50% at 0% 100%,rgba(240,134,43,.10),transparent 60%),var(--bg-band)!important}
main > section[style*="#FAF7F2"]:not(.l-hero):not(.l-dark){background:var(--bg-2)!important}
.l-dark.l-dark{background:linear-gradient(135deg,#1C5B58 0%,#124645 50%,var(--petrol-deep) 100%)!important}
main > section[style*="background:#1F5D5A"],.l-dark,.l-cta{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(135deg,#1C5B58 0%,#124645 50%,var(--petrol-deep) 100%)!important;color:#FFFFFF}
main > section[style*="background:#1F5D5A"]::before,.l-dark::before,.l-cta::before{content:"";position:absolute;z-index:-1;width:min(60vw,640px);aspect-ratio:1;right:-10vw;top:-50%;border-radius:50%;background:radial-gradient(circle,rgba(43,179,163,.5),transparent 65%);filter:blur(40px)}
main > section[style*="background:#1F5D5A"]::after,.l-dark::after,.l-cta::after{content:"";position:absolute;z-index:-1;width:min(40vw,420px);aspect-ratio:1;left:-8vw;bottom:-60%;border-radius:50%;background:radial-gradient(circle,rgba(240,134,43,.38),transparent 65%);filter:blur(40px)}
.l-dark .l-h,main > section[style*="background:#1F5D5A"] .l-h{color:#FFFFFF}
.l-dark .l-label,main > section[style*="background:#1F5D5A"] .l-label{color:var(--teal-2)}
.l-dark .l-card{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:#FFFFFF;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.l-dark .l-card:hover{border-color:rgba(159,211,200,.6)}
.l-dark .l-card .l-h{color:#FFFFFF}
.l-dark .l-card p,.l-dark .l-dlist span{color:#D6EAE5}
.l-dark p[style*="#4F6260"],.l-dark span[style*="#4F6260"]{color:#D6EAE5!important}
.l-dark .l-dlist strong{color:#FFFFFF}
.l-dark .l-label::before{background:linear-gradient(90deg,var(--orange),var(--teal-2))}
.l-dark .l-dlist li{border-color:rgba(255,255,255,.12)}
.l-grain{position:relative}
.l-grain::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.8'/></svg>")}

/* --- homepagina-onderdelen --- */
.l-strip{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 26px;justify-content:center}
.l-strip li{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:14px;color:var(--petrol);padding:6px 0}
.l-strip svg{color:var(--orange);flex:none}
.l-grid2{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.l-aud{grid-column:span 4;padding:0;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:var(--ink)}
.l-dienst{grid-column:span 4;background:#FFFFFF}
@media (max-width:1080px){.l-aud{grid-column:span 6}.l-dienst{grid-column:span 12}}
@media (max-width:720px){.l-aud,.l-dienst{grid-column:span 12}}
.l-aud-photo{position:relative;min-height:180px;background:linear-gradient(135deg,#D6EFEA,#F4EFE6 70%,#FBE3CC);display:grid;place-items:start start;padding:14px;overflow:hidden}

re\">Bekijk wat wij voor werkgevers doen <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8h10M9 4l4 4-4 4\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/span>\n<\/div>\n<\/a>\n<div class=\"l-card l-dienst\">\n<div style=\"display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px\"><h3 class=\"l-h\" style=\"font-size:24px\">Onze diensten<\/h3><span class=\"l-chip\" style=\"min-height:34px;font-size:13px\">Altijd maatwerk<\/span><\/div>\n<ul class=\"l-dlist\">\n<li><strong>Werktaal en vaktaal<\/strong><span>Instructies begrijpen, vragen stellen, veiligheidswoorden herkennen, begrippen uit de eigen sector.<\/span><\/li>\n<li><strong>Digitale vaardigheden<\/strong><span>Rooster-app, uren invoeren, e-mail, online ziekmelden en veilig omgaan met wachtwoorden.<\/span><\/li>\n<li><strong>Begeleiding richting werk<\/strong><span>Talenten en leerbehoeften in kaart, werkgerichte doelen, oefenen voor de volgende stap.<\/span><\/li>\n<li><strong>Coaching van werknemer en werkgever<\/strong><span>Verwachtingen, communicatie en samenwerking op de werkvloer.<\/span><\/li>\n<li><strong>Begeleiding tijdens het werk<\/strong><span>Vaste contactmomenten, praktische leerdoelen en evaluaties.<\/span><\/li>\n<li><strong>Nazorg<\/strong><span>Ondersteuning na de start of afronding, volgens afspraak.<\/span><\/li>\n<\/ul>\n<a class=\"l-more\" href=\"aanpak.html\">Alle diensten en de aanpak <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8h10M9 4l4 4-4 4\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/a>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- ZO WERKT HET: tijdlijn -->\n<section aria-labelledby=\"hoe-title\" style=\"background:#E7F3F0\">\n<div style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,7vw,96px) max(20px,4vw)\">\n<div class=\"l-rv\" style=\"display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between;align-items:flex-end;margin-bottom:44px\">\n<div><p class=\"l-label\" style=\"margin:0 0 12px\">Onze aanpak<\/p><h2 id=\"hoe-title\" class=\"l-h\" style=\"font-size:clamp(30px,4vw,48px)\">Zo werkt Verbind<span class=\"l-or\">&amp;<\/span>GO<\/h2><\/div>\n<p style=\"margin:0;max-width:44ch;color:#4F6260;line-height:1.6\">Taal en werk gaan waar mogelijk hand in hand. Vijf stappen, één doorlopende lijn, één vaste begeleider.<\/p>\n<\/div>\n<ol class=\"l-rv l-steps\">\n<li><span class=\"l-node\">1<\/span><svg width=\"30\" height=\"30\" viewBox=\"0 0 34 34\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"6\" stroke=\"currentColor\" stroke-width=\"2.2\"/><circle cx=\"24\" cy=\"14\" r=\"4\" stroke=\"currentColor\" stroke-width=\"2.2\"/><path d=\"M3 29c1-7 5-11 9-11s8 4 9 11M20 29c1-5 3-8 5-8s4 3 5 8\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><\/svg><h3 class=\"l-h\" style=\"font-size:19px\">Kennismaking deelnemer<\/h3><p>We luisteren naar wat iemand kan, wil en nodig heeft. Waar dat past, praten gemeente of werkgever mee.<\/p><\/li>\n<li><span class=\"l-node\">2<\/span><svg width=\"30\" height=\"30\" viewBox=\"0 0 34 34\" fill=\"none\" aria-hidden=\"true\"><path d=\"M5 9l10 5 10-5M5 9v16l10 5 10-5V9M15 14v16\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><\/svg><h3 class=\"l-h\" style=\"font-size:19px\">Doelen afspreken<\/h3><p>Concrete, werkgerichte doelen. Wie doet wat, en wanneer kijken we samen terug?<\/p><\/li>\n<li><span class=\"l-node\">3<\/span><svg width=\"30\" height=\"30\" viewBox=\"0 0 34 34\" fill=\"none\" aria-hidden=\"true\"><path d=\"M4 8h9a3 3 0 0 1 3 3v17a2 2 0 0 0-2-2H4zM30 8h-9a3 3 0 0 0-3 3v17a2 2 0 0 1 2-2h10z\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><\/svg><h3 class=\"l-h\" style=\"font-size:19px\">Leren en oefenen<\/h3><p>Werktaal, vaktaal, digitale vaardigheden en werknemersvaardigheden, met korte opdrachten over echte situaties.<\/p><\/li>\n<li><span class=\"l-node\">4<\/span><svg width=\"30\" height=\"30\" viewBox=\"0 0 34 34\" fill=\"none\" aria-hidden=\"true\"><rect x=\"4\" y=\"11\" width=\"26\" height=\"17\" rx=\"3\" stroke=\"currentColor\" stroke-width=\"2.2\"/><path d=\"M12 11V8a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v3M4 19h26\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><\/svg><h3 class=\"l-h\" style=\"font-size:19px\">Starten of groeien op het werk<\/h3><p>Begeleiding op de werkvloer en afstemming met de leidinggevende.<\/p><\/li>\n<li><span class=\"l-node\">5<\/span><svg width=\"30\" height=\"30\" viewBox=\"0 0 34 34\" fill=\"none\" aria-hidden=\"true\"><path d=\"M6 28V18M15 28V10M24 28V14M31 28H3\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><\/svg><h3 class=\"l-h\" style=\"font-size:19px\">Evalueren en nazorg<\/h3><p>Ook na de start blijven we betrokken, volgens de afspraken die we samen maken.<\/p><\/li>\n<\/ol>\n<div class=\"l-rv\" style=\"margin-top:36px;display:flex;flex-wrap:wrap;gap:12px;align-items:center\"><a class=\"l-btn l-btn-primary\" href=\"aanpak.html\">Bekijk elke stap <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8h10M9 4l4 4-4 4\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/a><span style=\"color:#4F6260;font-size:15px\">Interactieve uitleg per stap op de pagina Onze aanpak.<\/span><\/div>\n<\/div>\n<\/section>\n\n<!-- BEGELEIDING: foto + tekst -->\n<section aria-labelledby=\"beg-title\" style=\"background:#FFFFFF\">\n<div style=\"max-width:1280px;margin:0 auto;padding:clamp(64px,8vw,104px) max(20px,4vw);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:48px 64px;align-items:center\">\n<div class=\"l-rv\" style=\"position:relative;min-width:0\">\n<div class=\"l-art\" role=\"img\" aria-label=\"Illustratie: voortgang die stap voor stap stijgt\"><svg viewBox=\"0 0 480 360\" preserveAspectRatio=\"xMidYMid meet\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs>\n<linearGradient id=\"ibbg\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#174A48\"/><stop offset=\".55\" stop-color=\"#0B2E2D\"/><stop offset=\"1\" stop-color=\"#071F1E\"/><\/linearGradient>\n<filter id=\"ibblur\" x=\"-50%\" y=\"-50%\" width=\"200%\" height=\"200%\"><feGaussianBlur stdDeviation=\"40\"/><\/filter>\n<filter id=\"ibsoft\" x=\"-150%\" y=\"-150%\" width=\"400%\" height=\"400%\"><feGaussianBlur stdDeviation=\"14\"/><\/filter>\n<filter id=\"ibglow\" x=\"-100%\" y=\"-100%\" width=\"300%\" height=\"300%\"><feGaussianBlur stdDeviation=\"7\" result=\"b\"/><feMerge><feMergeNode in=\"b\"/><feMergeNode in=\"SourceGraphic\"/><\/feMerge><\/filter>\n<filter id=\"ibsh\" x=\"-100%\" y=\"-200%\" width=\"300%\" height=\"600%\"><feDropShadow dx=\"0\" dy=\"12\" stdDeviation=\"12\" flood-color=\"#000\" flood-opacity=\".22\"/><\/filter>\n<linearGradient id=\"ibgl\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#FFFFFF\" stop-opacity=\".16\"/><stop offset=\"1\" stop-color=\"#FFFFFF\" stop-opacity=\".06\"/><\/linearGradient>\n<\/defs>\n<rect x=\"-480\" y=\"-360\" width=\"1440\" height=\"1080\" fill=\"url(#ibbg)\"/>\n<circle cx=\"408.0\" cy=\"36.0\" r=\"153.6\" fill=\"#2BB3A3\" fill-opacity=\".45\" filter=\"url(#ibblur)\"/>\n<circle cx=\"38.4\" cy=\"342.0\" r=\"124.80000000000001\" fill=\"#F0862B\" fill-opacity=\".30\" filter=\"url(#ibblur)\"/><defs><linearGradient id=\"ibar\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#2BB3A3\" stop-opacity=\".45\"/><stop offset=\"1\" stop-color=\"#2BB3A3\" stop-opacity=\"0\"/><\/linearGradient><linearGradient id=\"ibln\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"><stop offset=\"0\" stop-color=\"#F0862B\"/><stop offset=\"1\" stop-color=\"#9FE3D6\"/><\/linearGradient><\/defs><path d=\"M24 100 H456\" stroke=\"#FFFFFF\" stroke-opacity=\".07\"/><path d=\"M24 160 H456\" stroke=\"#FFFFFF\" stroke-opacity=\".07\"/><path d=\"M24 220 H456\" stroke=\"#FFFFFF\" stroke-opacity=\".07\"/><path d=\"M24 280 H456\" stroke=\"#FFFFFF\" stroke-opacity=\".07\"/><path d=\"M30 290 C 120 285, 160 240, 230 215 S 340 150, 420 100 L420 330 L30 330 Z\" fill=\"url(#ibar)\"/><path d=\"M30 290 C 120 285, 160 240, 230 215 S 340 150, 420 100\" fill=\"none\" stroke=\"url(#ibln)\" stroke-width=\"4\" stroke-linecap=\"round\" filter=\"url(#ibglow)\"/><path class=\"l-flow\" d=\"M30 290 C 120 285, 160 240, 230 215 S 340 150, 420 100\" fill=\"none\" stroke=\"#FFFFFF\" stroke-opacity=\".7\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><circle cx=\"420\" cy=\"100\" r=\"18.900000000000002\" fill=\"#9FE3D6\" fill-opacity=\".22\" filter=\"url(#ibsoft)\"/><circle cx=\"420\" cy=\"100\" r=\"19\" fill=\"none\" stroke=\"#9FE3D6\" stroke-opacity=\".35\"/><circle cx=\"420\" cy=\"100\" r=\"9\" fill=\"#9FE3D6\" filter=\"url(#ibglow)\"/><rect x=\"40\" y=\"300\" width=\"96.4\" height=\"32\" rx=\"16\" fill=\"url(#ibgl)\" stroke=\"#FFFFFF\" stroke-opacity=\".22\"/><circle cx=\"57\" cy=\"316\" r=\"4.5\" fill=\"#F0862B\"/><text x=\"69\" y=\"321\" font-family=\"Outfit, Figtree, system-ui, sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"#FFFFFF\">Met hulp<\/text><rect x=\"300\" y=\"196\" width=\"118.3\" height=\"32\" rx=\"16\" fill=\"url(#ibgl)\" stroke=\"#FFFFFF\" stroke-opacity=\".22\"/><circle cx=\"317\" cy=\"212\" r=\"4.5\" fill=\"#9FE3D6\"/><text x=\"329\" y=\"217\" font-family=\"Outfit, Figtree, system-ui, sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"#FFFFFF\">Zelfstandig<\/text><\/svg><\/div>\n<div class=\"l-over\" aria-hidden=\"true\"><p class=\"l-label\" style=\"margin:0 0 8px;font-size:11px\">Werkafspraak · gedeeld<\/p><p style=\"margin:0;font-weight:700\">Nieuwe taken worden eerst voorgedaan<\/p><p style=\"margin:6px 0 0;font-size:13px;color:#4F6260\">Afgesproken met de teamleider · fictief voorbeeld<\/p><\/div>\n<\/div>\n<div class=\"l-rv\" style=\"min-width:0\">\n<p class=\"l-label\" style=\"margin:0 0 12px\">Begeleiding<\/p>\n<h2 id=\"beg-title\" class=\"l-h\" style=\"font-size:clamp(30px,4vw,46px)\">Persoonlijke begeleiding. <span class=\"l-or\">Samen vooruit.<\/span><\/h2>\n<p style=\"margin:20px 0 22px;font-size:17px;line-height:1.65;color:#4F6260\">We combineren NT2-onderwijs, digitale vaardigheden, coaching en begeleiding op de werkvloer. Zo bouwen we stap voor stap aan zelfvertrouwen, vaardigheden en werk dat past en blijft. Niet iedereen heeft taalondersteuning nodig; we beginnen bij wat iemand kan en wil.<\/p>\n<ul style=\"list-style:none;margin:0 0 24px;padding:0;display:flex;flex-direction:column;gap:6px\">\n<li class=\"l-sit\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"#FBE3CC\"/><path d=\"M6 10l3 3 5-6\" fill=\"none\" stroke=\"#C96A1A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><span><strong>Een vaste begeleider<\/strong> die het traject kent en bereikbaar is.<\/span><\/li>\n<li class=\"l-sit\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"#FBE3CC\"/><path d=\"M6 10l3 3 5-6\" fill=\"none\" stroke=\"#C96A1A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><span><strong>Doelen en afspraken op papier<\/strong>, voor iedereen helder.<\/span><\/li>\n<li class=\"l-sit\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"#FBE3CC\"/><path d=\"M6 10l3 3 5-6\" fill=\"none\" stroke=\"#C96A1A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><span><strong>Duidelijk wie wat ziet<\/strong>: interne notities blijven intern.<\/span><\/li>\n<\/ul>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center\"><span class=\"l-chip\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 9.5l3.5 3.5L15 4.5\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>Werk centraal in de inburgering<\/span><span style=\"color:#4F6260;line-height:1.5\">Het kabinet wil werk vanaf 2027 nadrukkelijker centraal stellen. Wij helpen gemeenten en werkgevers om statushouders snel én duurzaam aan het werk te krijgen.<\/span><\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- PORTAAL-IMPRESSIE -->\n<section class=\"l-dark l-grain\" aria-labelledby=\"port-title\" style=\"background:#FAF7F2;overflow:hidden\">\n<div style=\"max-width:1280px;margin:0 auto;padding:clamp(64px,8vw,104px) max(20px,4vw);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:40px 56px;align-items:center\">\n<div class=\"l-rv\" style=\"min-width:0\">\n<p class=\"l-label\" style=\"margin:0 0 12px\">Portaal<\/p>\n<h2 id=\"port-title\" class=\"l-h\" style=\"font-size:clamp(30px,4vw,46px)\">Eén plek. <span class=\"l-or\">Ieder zijn eigen zicht.<\/span><\/h2>\n<p style=\"margin:20px 0 22px;font-size:17px;line-height:1.65;color:#4F6260\">Deelnemers zien hun afspraken, opdrachten en voortgang. Begeleiders plannen en leggen vast. Werkgevers en gemeenten zien alleen wat met hen is afgesproken. Voortgang wordt per vaardigheid zichtbaar, zonder onverklaarbare scores.<\/p>\n<ul class=\"l-dlist\" style=\"margin-bottom:26px\">\n<li><strong>Deelnemer<\/strong><span>Afspraken, opdrachten en \"wat kan ik al?\", ook digitaal.<\/span><\/li>\n<li><strong>Werkgever<\/strong><span>Gedeelde werkafspraken en werkdoelen, geen interne notities.<\/span><\/li>\n<li><strong>Gemeente<\/strong><span>Voortgang op vooraf afgesproken indicatoren.<\/span><\/li>\n<\/ul>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px\"><a class=\"l-btn l-btn-orange\" href=\"inloggen.html\">Bekijk het portaal <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8h10M9 4l4 4-4 4\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/a><\/div>\n<\/div>\n<div class=\"l-rv l-mock\" role=\"img\" aria-label=\"Impressie van het portaal: dashboard met afspraak, voortgang per domein en volgende stappen. Fictieve gegevens.\">\n<div class=\"l-mock-bar\"><i><\/i><i><\/i><i><\/i><span>portaal · demo<\/span><\/div>\n<div class=\"l-mock-body\">\n<div class=\"l-mock-side\"><b><\/b><b style=\"width:70%\"><\/b><b style=\"width:55%\"><\/b><b style=\"width:62%\"><\/b><b style=\"width:48%\"><\/b><\/div>\n<div class=\"l-mock-main\">\n<div class=\"l-mock-title\">Goedemiddag, Samira<\/div>\n<div class=\"l-mock-grid\">\n<div class=\"l-mock-card dark\"><small>Volgende afspraak<\/small><strong>vr 09:30<\/strong><em>Begeleidingsgesprek · online<\/em><\/div>\n<div class=\"l-mock-card\"><small>Wat kan ik al?<\/small><div class=\"l-mini\"><span>Werktaal<\/span><div><i style=\"width:72%;background:#2A7A74\"><\/i><\/div><\/div><div class=\"l-mini\"><span>Vaktaal<\/span><div><i style=\"width:48%;background:#F0862B\"><\/i><\/div><\/div><div class=\"l-mini\"><span>Samenwerking<\/span><div><i style=\"width:66%;background:#8A5BB5\"><\/i><\/div><\/div><\/div>\n<div class=\"l-mock-card wide\"><small>Volgende opdracht<\/small><strong>Veiligheidswoorden in het magazijn<\/strong><em>Vaktaal · ongeveer 15 minuten<\/em><u><\/u><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- SITUATIES -->\n<section aria-labelledby=\"sit-title\" style=\"background:#FFFFFF\">\n<div style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,7vw,96px) max(20px,4vw)\">\n<div class=\"l-rv\" style=\"text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:36px\">\n<p class=\"l-label\" style=\"margin:0\">Herkenbaar?<\/p>\n<h2 id=\"sit-title\" class=\"l-h\" style=\"font-size:clamp(30px,4vw,46px)\">Situaties waarin wij helpen<\/h2>\n<p style=\"margin:0;max-width:56ch;color:#4F6260;line-height:1.6\">Taal opent de deur naar werk. Begeleiding houdt die deur open. Daarom werken we aan allebei, op de werkvloer.<\/p>\n<\/div>\n<div class=\"l-rv l-sits\">\n<div class=\"l-sitc\"><span>01<\/span><p>Een nieuwe medewerker is gemotiveerd, maar begrijpt werkinstructies of veiligheidsregels nog niet goed.<\/p><\/div>\n<div class=\"l-sitc\"><span>02<\/span><p>Een leidinggevende merkt dat afspraken anders worden begrepen dan ze bedoeld zijn.<\/p><\/div>\n<div class=\"l-sitc\"><span>03<\/span><p>Iemand werkt al een tijd niet en wil een stap zetten, maar weet niet goed waar te beginnen.<\/p><\/div>\n<div class=\"l-sitc\"><span>04<\/span><p>Een medewerker moet uren invoeren, een rooster-app gebruiken of zich online ziekmelden, en loopt daarop vast.<\/p><\/div>\n<div class=\"l-sitc\"><span>05<\/span><p>Een gemeente wil statushouders sneller aan het werk helpen en zoekt begeleiding die taal, werk en persoonlijke doelen samenbrengt in één traject.<\/p><\/div>\n<div class=\"l-sitc\"><span>06<\/span><p>Na een goede start valt de begeleiding weg, en het werk dreigt alsnog te stoppen.<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- CTA -->\n<section class=\"l-cta\" aria-labelledby=\"cta-title\">\n<div style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,7vw,96px) max(20px,4vw);display:flex;flex-wrap:wrap;gap:28px 48px;align-items:center;justify-content:space-between;position:relative\">\n<div class=\"l-rv\" style=\"flex:1 1 420px;min-width:0\">\n<p class=\"l-label\" style=\"margin:0 0 12px;color:#9FD3C8\">Samenwerken<\/p>\n<h2 id=\"cta-title\" class=\"l-h\" style=\"font-size:clamp(32px,4.4vw,52px);color:#FFFFFF;max-width:14ch\">Bouw met ons aan <span class=\"l-or\">kansen.<\/span><\/h2>\n<p style=\"margin:18px 0 0;max-width:52ch;line-height:1.6;color:#D6EAE5;font-size:17px\">In een eerste gesprek bespreken we uw vraag en wat er nodig is. Daarna doen we een voorstel op maat. Een gesprek verplicht u tot ni

<style>
body{margin:0;background:#FFFFFF}
*{box-sizing:border-box}
a{color:#1F5D5A}a:hover{color:#17494A}
:focus-visible{outline:3px solid #F0862B;outline-offset:3px;border-radius:6px}
a[href="#inhoud"]:focus{top:12px!important}
button{font:inherit}
.l-h{font-family:'Outfit',system-ui,sans-serif;font-weight:700;letter-spacing:-0.025em;line-height:1.05;margin:0;color:#1B2A2A;text-wrap:balance}
.l-or{color:#F0862B}
.l-label{font:700 12px/1.3 'Figtree',system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#1F5D5A}
.l-bar{width:56px;height:4px;border-radius:4px;background:#F0862B}
.l-btn{display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:0 26px;border-radius:12px;font:600 16px/1 'Figtree',system-ui,sans-serif;text-decoration:none;border:0;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),background .2s ease,box-shadow .25s ease,color .2s ease,opacity .2s ease}
.l-btn:hover{transform:translateY(-2px)}
.l-btn-primary{background:#1F5D5A;color:#FFFFFF}.l-btn-primary:hover{background:#17494A;color:#FFFFFF}
.l-btn-orange{background:#F0862B;color:#FFFFFF}.l-btn-orange:hover{background:#DB7620;color:#FFFFFF}
.l-btn-outline{background:#FFFFFF;border:1.5px solid #D7CFC2;color:#1F5D5A}.l-btn-outline:hover{border-color:#1F5D5A;color:#1F5D5A}
.l-card{background:#FAF7F2;border:1px solid #EAE2D6;border-radius:18px;padding:clamp(24px,3vw,36px);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease}
.l-card:hover{transform:translateY(-4px);box-shadow:0 24px 44px -28px rgba(31,93,90,.4)}
.l-num{flex:none;width:44px;height:44px;border-radius:50%;background:#F0862B;color:#FFFFFF;display:grid;place-items:center;font:700 19px 'Outfit',sans-serif}
.l-stepbtn{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:16px;border:1.5px solid #D7CFC2;background:#FFFFFF;text-align:left;cursor:pointer;color:#1B2A2A;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .2s ease,background .2s ease,color .2s ease;min-width:0}
.l-stepbtn:hover{transform:translateY(-3px);border-color:#1F5D5A}
.l-stepbtn[aria-selected="true"]{background:#1F5D5A;color:#FFFFFF;border-color:#1F5D5A}
.l-stepbtn[aria-selected="true"] .l-num{background:#F0862B}
.l-stepbtn .l-num{background:#1F5D5A}
.l-steps-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.l-stepitem{min-width:0;display:flex;flex-direction:column}
.l-stepitem .l-stepbtn{height:100%}
.l-chev,.l-inline{display:none}
.l-gr{color:#1F5D5A}
@media (max-width:900px){
.l-steps-grid{grid-template-columns:1fr;gap:10px}
.l-desk{display:none!important}
.l-stepitem .l-stepbtn{flex-direction:row;align-items:center;gap:14px;padding:14px 16px;height:auto}
.l-chev{display:block;margin-left:auto;width:10px;height:10px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .25s ease;flex:none}
.l-stepbtn[aria-expanded="true"] .l-chev{transform:rotate(-135deg)}
.l-inline{display:block;margin:8px 0 6px;padding:18px;border-radius:18px;background:#FAF7F2;border:1px solid #EAE2D6;line-height:1.6;color:#4F6260}
.l-inline .l-h{color:#0F1F1F}
}
.l-track{position:relative;height:6px;border-radius:6px;background:#EAE2D6;overflow:hidden;margin:18px 0 8px}
.l-track i{display:block;height:100%;background:#F0862B;border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.l-panel{animation:l-fade .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes l-fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.l-photo{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(135deg,#DCEFEA 0%,#F3EDE4 60%,#FBE3CC 100%);display:grid;place-items:center;min-height:260px;aspect-ratio:4/3;max-width:100%}
.l-photo span{position:absolute;left:16px;bottom:16px;z-index:1;background:rgba(255,255,255,.9);border:1.5px dashed #F0862B;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:#8A4A12;max-width:calc(100% - 32px)}
.l-photo svg{opacity:.6}
.l-w{display:inline-block;animation:l-up .8s cubic-bezier(.2,.8,.2,1) both}
.l-w:nth-child(2){animation-delay:.06s}.l-w:nth-child(3){animation-delay:.12s}.l-w:nth-child(4){animation-delay:.18s}
@keyframes l-up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.l-fade{animation:l-fade .9s .35s cubic-bezier(.2,.8,.2,1) both}
@supports (animation-timeline: view()){.l-rv{animation:l-rise linear both;animation-timeline:view();animation-range:entry 5% entry 35%}@keyframes l-rise{from{opacity:.15;transform:translateY(28px)}to{opacity:1;transform:none}}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* @site-css */
/* ==========================================================================
   Verbind & GO — gedeelde designlaag v3 ("ultra modern")
   Bron: design/site.css · wordt met tools/sync_css.py in elke pagina gezet.
   Basis blijft: wit/warm wit, petrol #1F5D5A, oranje #F0862B, Outfit + Figtree.
   ========================================================================== */
:root{
  --ink:#0F1F1F;--ink-2:#4F6260;--bg:#FFFFFF;--bg-2:#F7F4EE;--bg-band:#E9F4F1;
  --petrol:#1F5D5A;--petrol-2:#17494A;--petrol-deep:#0D3534;--teal:#2BB3A3;--teal-2:#9FD3C8;
  --orange:#F0862B;--orange-2:#DB7620;--coral:#F0862B;--violet:#8A5BB5;
  --line:rgba(15,31,31,.08);--line-2:rgba(15,31,31,.14);
  --r-s:14px;--r-m:20px;--r-l:28px;--r-xl:36px;
  --sh-1:0 1px 2px rgba(15,31,31,.04),0 10px 30px -24px rgba(15,31,31,.25);
  --sh-2:0 2px 4px rgba(15,31,31,.05),0 30px 60px -32px rgba(31,93,90,.45);
  --ease:cubic-bezier(.2,.8,.2,1);
}
html{scroll-behavior:smooth}
body{background:var(--bg)}
::selection{background:#FBE3CC;color:#5C2A0E}

/* --- typografie --- */
.l-h{font-weight:800;letter-spacing:-0.04em;line-height:1.06;color:var(--ink)}
h1.l-h{letter-spacing:-0.05em;line-height:1.04}
.l-w{padding-bottom:.06em;margin-bottom:-.06em;line-height:1.1}
.l-or{color:var(--orange);background:none;-webkit-text-fill-color:var(--orange)}
.l-gr{color:var(--petrol);-webkit-text-fill-color:var(--petrol)}
.l-label{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:12px;letter-spacing:.18em;color:var(--petrol)}
.l-label::before{content:"";width:22px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--orange),var(--teal))}
.l-bar{width:64px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--orange),var(--teal) 60%,var(--petrol))}
main p{text-wrap:pretty}

/* --- knoppen --- */
.l-btn{border-radius:999px;min-height:56px;padding:0 28px;font-weight:600;letter-spacing:-0.005em;box-shadow:none;position:relative;overflow:hidden;isolation:isolate}
.l-btn svg{transition:transform .3s var(--ease)}
.l-btn:hover svg{transform:translateX(4px)}
.l-btn-primary{background:var(--petrol-deep);color:#FFFFFF;box-shadow:0 14px 30px -16px rgba(13,53,52,.8)}
.l-btn-primary::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(135deg,#2A7A74,var(--petrol) 55%,var(--petrol-deep));opacity:1;transition:opacity .3s ease}
.l-btn-primary:hover{color:#FFFFFF;transform:translateY(-2px);box-shadow:0 22px 40px -18px rgba(13,53,52,.9)}
.l-btn-primary:hover::before{opacity:.85}
.l-btn-orange{background:var(--orange);color:#FFFFFF;box-shadow:0 14px 30px -16px rgba(240,134,43,.9)}
.l-btn-orange:hover{background:var(--orange-2);color:#FFFFFF;transform:translateY(-2px);box-shadow:0 22px 40px -18px rgba(240,134,43,.95)}
.l-btn-outline{background:rgba(255,255,255,.7);border:1.5px solid var(--line-2);color:var(--petrol);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.l-btn-outline:hover{border-color:var(--petrol);background:#FFFFFF;color:var(--petrol);transform:translateY(-2px)}
.l-btn-glass{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.35);color:#FFFFFF;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.l-btn-glass:hover{background:rgba(255,255,255,.2);border-color:#FFFFFF;color:#FFFFFF;transform:translateY(-2px)}
.l-submit{border-radius:999px;background:var(--orange);box-shadow:0 14px 30px -16px rgba(240,134,43,.9)}
.l-submit:hover{background:var(--orange-2)}

/* --- kaarten en vlakken --- */
.l-card{background:#FFFFFF;border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1);transition:transform .4s var(--ease),box-shadow .4s ease,border-color .3s ease}
.l-card:hover{transform:translateY(-6px);box-shadow:var(--sh-2);border-color:rgba(43,179,163,.45)}
.l-icon{width:64px;height:64px;border-radius:20px;background:linear-gradient(145deg,#E9F4F1,#FFFFFF);border:1px solid rgba(31,93,90,.12);box-shadow:inset 0 1px 0 #FFFFFF,0 8px 18px -12px rgba(31,93,90,.5);color:var(--petrol)}
.l-icon::before{width:14px;height:14px;right:-4px;top:-4px;background:var(--orange);box-shadow:0 0 0 3px #FFFFFF}
.l-num{background:var(--orange);box-shadow:0 10px 18px -8px rgba(240,134,43,.7)}
.l-photo{border-radius:var(--r-l);background:linear-gradient(135deg,#D6EFEA 0%,#F4EFE6 55%,#FBE3CC 100%);box-shadow:inset 0 0 0 1px rgba(31,93,90,.08),0 40px 70px -48px rgba(31,93,90,.55)}
.l-photo::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(31,93,90,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(31,93,90,.07) 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(70% 70% at 50% 50%,#000 30%,transparent 100%);-webkit-mask-image:radial-gradient(70% 70% at 50% 50%,#000 30%,transparent 100%)}
.l-photo::after{content:"";position:absolute;width:60%;aspect-ratio:1;right:-20%;top:-25%;border-radius:50%;background:radial-gradient(circle,rgba(43,179,163,.35),transparent 65%);filter:blur(30px)}
.l-photo span{border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:1}
.l-chip{border-radius:999px;background:rgba(255,255,255,.8);border:1.5px solid rgba(240,134,43,.5)}
.l-mark,.lf-mark{border-radius:999px}

/* --- hero --- */
.l-hero{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(180deg,#F7F4EE 0%,#FFFFFF 100%);padding-top:92px}
.lh{margin-bottom:-92px}
main > section:first-child:not(.l-hero){padding-top:92px}
.l-hero::before,.l-hero::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(70px);pointer-events:none}
.l-hero::before{width:min(64vw,760px);aspect-ratio:1;right:-14vw;top:-32%;background:radial-gradient(circle at 40% 40%,rgba(43,179,163,.34),rgba(31,93,90,.12) 45%,transparent 70%);animation:l-drift 18s ease-in-out infinite alternate}
.l-hero::after{width:min(42vw,480px);aspect-ratio:1;left:-10vw;bottom:-36%;background:radial-gradient(circle at 50% 50%,rgba(240,134,43,.26),transparent 65%);animation:l-drift 22s ease-in-out infinite alternate-reverse}
@keyframes l-drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-4%,6%,0) scale(1.08)}}
.l-hero .l-label{padding:9px 14px 9px 10px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid rgba(31,93,90,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 1px 2px rgba(15,31,31,.05)}
.l-hero .l-label::before{width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px rgba(240,134,43,.2)}
.l-hero h1.l-h{font-size:clamp(44px,6.6vw,92px)}
.l-hero .l-tile .l-label{display:block;padding:0;border:0;background:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;letter-spacing:.16em;font-size:11px}
.l-hero .l-tile .l-label::before{display:none}
.l-float{position:absolute;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;border-radius:999px;background:rgba(255,255,255,.86);border:1px solid rgba(31,93,90,.12);box-shadow:0 14px 30px -18px rgba(15,31,31,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap;animation:l-float 6s ease-in-out infinite}
.l-float i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#E9F4F1,#CFE9E3);color:var(--petrol);flex:none}
.l-float.o i{background:linear-gradient(135deg,#FBE3CC,#F7B57E);color:#8A4A12}
@keyframes l-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (max-width:640px){.l-float{display:none}}
.l-tag{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px 0 10px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(31,93,90,.14);color:var(--petrol);font-weight:600;font-size:14px;text-decoration:none;transition:background .2s ease,border-color .2s ease,transform .25s var(--ease)}
.l-tag i{width:8px;height:8px;border-radius:50%;background:var(--teal)}
.l-tag:hover{background:#FFFFFF;border-color:var(--petrol);transform:translateY(-1px)}

/* bento in de hero */
.l-bento{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:auto auto;gap:14px;min-width:0}
.l-b-photo{grid-row:1/3;min-height:380px;aspect-ratio:auto}
.l-tile{border-radius:24px;padding:18px 18px 16px;background:rgba(255,255,255,.86);border:1px solid rgba(31,93,90,.12);box-shadow:var(--sh-1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0;transition:transform .4s var(--ease),box-shadow .4s ease}
.l-tile:hover{transform:translateY(-4px);box-shadow:var(--sh-2)}
.l-tile-dark{background:linear-gradient(145deg,#276E6A,var(--petrol) 60%,var(--petrol-deep));color:#FFFFFF;border-color:transparent}
.l-mini{display:grid;grid-template-columns:minmax(78px,auto) 1fr;gap:10px;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink);margin-top:7px}
.l-mini div{height:8px;border-radius:999px;background:#F1EBE1;overflow:hidden}
.l-mini i{display:block;height:100%;border-radius:999px}
@media (max-width:640px){.l-bento{grid-template-columns:1fr}.l-b-photo{grid-row:auto;min-height:240px}}

/* --- marquee met diensten --- */
.l-marq{position:relative;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.l-marq ul{list-style:none;margin:0;padding:0;display:flex;gap:10px;width:max-content;animation:l-marq 38s linear infinite}
.l-marq:hover ul,.l-marq:focus-within ul{animation-play-state:paused}
.l-marq li{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:0 18px 0 12px;border-radius:999px;border:1px solid var(--line);background:#FFFFFF;font-weight:600;font-size:15px;color:var(--petrol);white-space:nowrap}
.l-marq li svg{color:var(--orange);flex:none}
@keyframes l-marq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.l-marq{mask-image:none;-webkit-mask-image:none}.l-marq ul{animation:none;flex-wrap:wrap;width:auto;justify-content:center}}

/* --- secties --- */
main > section[style*="#E7F3F0"]{background:radial-gradient(80% 60% at 100% 0%,rgba(43,179,163,.16),transparent 60%),radial-gradient(60% 50% at 0% 100%,rgba(240,134,43,.10),transparent 60%),var(--bg-band)!important}
main > section[style*="#FAF7F2"]:not(.l-hero):not(.l-dark){background:var(--bg-2)!important}
.l-dark.l-dark{background:linear-gradient(135deg,#1C5B58 0%,#124645 50%,var(--petrol-deep) 100%)!important}
main > section[style*="background:#1F5D5A"],.l-dark,.l-cta{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(135deg,#1C5B58 0%,#124645 50%,var(--petrol-deep) 100%)!important;color:#FFFFFF}
main > section[style*="background:#1F5D5A"]::before,.l-dark::before,.l-cta::before{content:"";position:absolute;z-index:-1;width:min(60vw,640px);aspect-ratio:1;right:-10vw;top:-50%;border-radius:50%;background:radial-gradient(circle,rgba(43,179,163,.5),transparent 65%);filter:blur(40px)}
main > section[style*="background:#1F5D5A"]::after,.l-dark::after,.l-cta::after{content:"";position:absolute;z-index:-1;width:min(40vw,420px);aspect-ratio:1;left:-8vw;bottom:-60%;border-radius:50%;background:radial-gradient(circle,rgba(240,134,43,.38),transparent 65%);filter:blur(40px)}
.l-dark .l-h,main > section[style*="background:#1F5D5A"] .l-h{color:#FFFFFF}
.l-dark .l-label,main > section[style*="background:#1F5D5A"] .l-label{color:var(--teal-2)}
.l-dark .l-card{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:#FFFFFF;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.l-dark .l-card:hover{border-color:rgba(159,211,200,.6)}
.l-dark .l-card .l-h{color:#FFFFFF}
.l-dark .l-card p,.l-dark .l-dlist span{color:#D6EAE5}
.l-dark p[style*="#4F6260"],.l-dark span[style*="#4F6260"]{color:#D6EAE5!important}
.l-dark .l-dlist strong{color:#FFFFFF}
.l-dark .l-label::before{background:linear-gradient(90deg,var(--orange),var(--teal-2))}
.l-dark .l-dlist li{border-color:rgba(255,255,255,.12)}
.l-grain{position:relative}
.l-grain::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.8'/></svg>")}

/* --- homepagina-onderdelen --- */
.l-strip{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 26px;justify-content:center}
.l-strip li{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:14px;color:var(--petrol);padding:6px 0}
.l-strip svg{color:var(--orange);flex:none}
.l-grid2{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.l-aud{grid-column:span 4;padding:0;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:var(--ink)}
.l-dienst{grid-column:span 4;background:#FFFFFF}
@media (max-width:1080px){.l-aud{grid-column:span 6}.l-dienst{grid-column:span 12}}
@media (max-width:720px){.l-aud,.l-dienst{grid-column:span 12}}
.l-aud-photo{position:relative;min-height:180px;background:linear-gradient(135deg,#D6EFEA,#F4EFE6 70%,#FBE3CC);display:grid;place-items:start start;padding:14px;overflow:hidden}
.l-aud-photo.o{background:linear-gradient(135deg,#FBE3CC,#F4EFE6 60%,#D6EFEA)}
.l-aud-photo.v{background:linear-gradient(135deg,#E6DDF2,#F4EFE6 60%,#D6EFEA)}

DC.register("Aanpak",{"tpl": "<div style=\"font-family:'Figtree',system-ui,sans-serif;color:#1B2A2A;background:#FFFFFF;overflow-x:clip\">\n<dc-import name=\"Header\" active=\"aanpak\" hint-size=\"100%,80px\"><\/dc-import>\n<main id=\"inhoud\">\n\n<section class=\"l-hero\" aria-labelledby=\"ap-title\" style=\"background:#FAF7F2\">\n<div style=\"max-width:1280px;margin:0 auto;padding:clamp(48px,6vw,88px) max(20px,4vw) clamp(56px,7vw,96px);display:flex;flex-wrap:wrap;gap:40px 56px;align-items:center\">\n<div style=\"flex:1 1 420px;min-width:0\">\n<p class=\"l-label l-fade\" style=\"margin:0 0 20px;animation-delay:.05s\">Onze aanpak<\/p>\n<h1 id=\"ap-title\" class=\"l-h\" style=\"font-size:clamp(40px,5.6vw,70px);max-width:13ch\"><span class=\"l-w\">Vijf<\/span> <span class=\"l-w\">vaste<\/span> <span class=\"l-w\">stappen,<\/span> <span class=\"l-w l-gr\">altijd op maat.<\/span><\/h1>\n<p class=\"l-fade\" style=\"margin:22px 0 0;max-width:54ch;font-size:18px;line-height:1.6;color:#4F6260\">Elk traject doorloopt dezelfde vijf stappen. Wat er binnen een stap gebeurt, hoe lang die duurt en welke diensten we inzetten, stemmen we af op de deelnemer en op de afspraken met gemeente of werkgever.<\/p>\n<div class=\"l-fade\" style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:30px\"><a class=\"l-btn l-btn-primary\" href=\"#st-title\">Bekijk de vijf stappen <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M8 3v10M4 9l4 4 4-4\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/a><\/div>\n<\/div>\n<div class=\"l-fade\" style=\"flex:1 1 380px;min-width:0;animation-delay:.2s\"><div class=\"l-art\" role=\"img\" aria-label=\"Illustratie: de vijf stappen van het traject\"><svg viewBox=\"0 0 480 360\" preserveAspectRatio=\"xMidYMid meet\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs>\n<linearGradient id=\"iabg\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\  stroke-opacity=\".35\"/><circle cx=\"240\" cy=\"196\" r=\"15\" fill=\"#F0862B\" filter=\"url(#iaglow)\"/><text x=\"240\" y=\"201\" text-anchor=\"middle\" font-family=\"Outfit, Figtree, system-ui, sans-serif\" font-size=\"14\" font-weight=\"800\" fill=\"#0B2E2D\">3<\/text><circle cx=\"330\" cy=\"150\" r=\"15\" fill=\"#0B2E2D\" stroke=\"#FFFFFF\" stroke-opacity=\".45\" stroke-width=\"1.5\"/><text x=\"330\" y=\"155\" text-anchor=\"middle\" font-family=\"Outfit, Figtree, system-ui, sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#FFFFFF\" fill-opacity=\".8\">4<\/text><circle cx=\"420\" cy=\"92\" r=\"15\" fill=\"#0B2E2D\" stroke=\"#FFFFFF\" stroke-opacity=\".45\" stroke-width=\"1.5\"/><text x=\"420\" y=\"97\" text-anchor=\"middle\" font-family=\"Outfit, Figtree, system-ui, sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#FFFFFF\" fill-opacity=\".8\">5<\/text><g filter=\"url(#iash)\"><rect x=\"36\" y=\"36\" width=\"210\" height=\"104\" rx=\"16\" fill=\"#FFFFFF\"/><\/g><text x=\"54\" y=\"62\" font-family=\"Outfit, Figtree, system-ui, sans-serif\" font-size=\"10\" font-weight=\"700\" letter-spacing=\"1.2\" fill=\"#F0862B\">STAP 3 VAN 5<\/text><text x=\"54\" y=\"84\" font-family=\"Outfit, Figtree, system-ui, sans-serif\" font-size=\"16\" font-weight=\"700\" fill=\"#0F1F1F\">Leren en oefenen<\/text><rect x=\"54\" y=\"102\" width=\"30\" height=\"6\" rx=\"3\" fill=\"#9FE3D6\"/><rect x=\"89\" y=\"102\" width=\"30\" height=\"6\" rx=\"3\" fill=\"#9FE3D6\"/><rect x=\"124\" y=\"102\" width=\"30\" height=\"6\" rx=\"3\" fill=\"#F0862B\"/><rect x=\"159\" y=\"102\" width=\"30\" height=\"6\" rx=\"3\" fill=\"#E3ECEA\"/><rect x=\"194\" y=\"102\" width=\"30\" height=\"6\" rx=\"3\" fill=\"#E3ECEA\"/><text x=\"54\" y=\"128\" font-family=\"Outfit, Figtree, system-ui, sans-serif\" font-size=\"11\" fill=\"#4F6260\">Eén vaste begeleider<\/text><rect x=\"290\" y=\"296\" width=\"184.0\" height=\"32\" rx=\"16\" fill=\"url(#iagl)\" stroke=\"#FFFFFF\" stroke-opacity=\".22\"/><circle cx=\"307\" cy=\"312\" r=\"4.5\" fill=\"#9FE3D6\"/><text x=\"319\" y=\"317\" font-family=\"Outfit, Figtree, system-ui, sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"#FFFFFF\">Maatwerk per persoon<\/text><\/svg><\/div><\/div>\n<\/div>\n<\/section>\n\n<!-- STAPPENVERKENNER -->\n<section aria-labelledby=\"st-title\" style=\"background:#FFFFFF\">\n<div style=\"max-width:1280px;margin:0 auto;padding:clamp(64px,8vw,96px) max(20px,4vw)\">\n<div class=\"l-rv\" style=\"text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:32px\"><h2 id=\"st-title\" class=\"l-h\" style=\"font-size:clamp(30px,4vw,46px)\">Zo werkt Verbind<span class=\"l-or\">&amp;<\/span>GO<\/h2><div class=\"l-bar\" aria-hidden=\"true\"><\/div><p style=\"margin:0;max-width:50ch;color:#4F6260;line-height:1.6\">Kies een stap om te zien wat er gebeurt, wie meedoet en wat er daarna ligt.<\/p><\/div>\n<div class=\"l-rv l-steps-grid\">\n<sc-for list=\"{{nodes}}\" as=\"n\" hint-placeholder-count=\"5\"><div class=\"l-stepitem\"><button type=\"button\" class=\"l-stepbtn\" id=\"{{n.btnId}}\" aria-expanded=\"{{n.selected}}\" aria-controls=\"{{n.panelId}}\" aria-selected=\"{{n.selected}}\" onClick=\"{{n.pick}}\"><span class=\"l-num\">{{n.n}}<\/span><span class=\"l-h\" style=\"font-size:18px;color:inherit\">{{n.label}}<\/span><span class=\"l-chev\" aria-hidden=\"true\"><\/span><\/button>\n<sc-if value=\"{{n.isSel}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"l-inline l-panel\" id=\"{{n.panelId}}\" role=\"region\" aria-labelledby=\"{{n.btnId}}\"><h3 class=\"l-h\" style=\"font-size:22px;margin:0 0 14px\">{{n.kop}}<\/h3><p class=\"l-label\" style=\"margin:0 0 4px\">Wat gebeurt er<\/p><p style=\"margin:0 0 12px\">{{n.wat}}<\/p><p class=\"l-label\" style=\"margin:0 0 4px\">Wie doet mee<\/p><p style=\"margin:0 0 12px\">{{n.wie}}<\/p><p class=\"l-label\" style=\"margin:0 0 4px\">Wat ligt er daarna<\/p><p style=\"margin:0\">{{n.daarna}}<\/p><\/div><\/sc-if>\n<\/div><\/sc-for>\n<\/div>\n<div class=\"l-track l-desk\" aria-hidden=\"true\"><i style=\"width:{{pct}}%\"><\/i><\/div>\n<div class=\"l-rv l-panel l-card l-desk\" aria-live=\"polite\" style=\"margin-top:18px;display:flex;flex-wrap:wrap;gap:28px 48px;align-items:flex-start;background:#FAF7F2\">\n<div style=\"flex:0 0 auto;display:flex;align-items:center;gap:14px\"><span class=\"l-num\" style=\"width:64px;height:64px;font-size:28px\">{{cur.n}}<\/span><div><p class=\"l-label\" style=\"margin:0 0 4px\">Stap {{cur.n}}<\/p><p class=\"l-h\" style=\"font-size:22px\">{{cur.label}}<\/p><\/div><\/div>\n<div style=\"flex:1 1 520px;min-width:0\">\n<h3 class=\"l-h\" style=\"font-size:clamp(24px,2.8vw,34px);margin-bottom:18px\">{{cur.kop}}<\/h3>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:20px 32px;line-height:1.6;color:#4F6260\">\n<div><p class=\"l-label\" style=\"margin:0 0 6px\">Wat gebeurt er<\/p><p style=\"margin:0\">{{cur.wat}}<\/p><\/div>\n<div><p class=\"l-label\" style=\"margin:0 0 6px\">Wie doet mee<\/p><p style=\"margin:0\">{{cur.wie}}<\/p><\/div>\n<div><p class=\"l-label\" style=\"margin:0 0 6px\">Wat ligt er daarna<\/p><p style=\"margin:0\">{{cur.daarna}}<\/p><\/div>\n<\/div>\n<div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:24px\"><button type=\"button\" class=\"l-btn l-btn-outline\" onClick=\"{{prev}}\" style=\"{{cur.prevStyle}}\">← Vorige stap<\/button><button type=\"button\" class=\"l-btn l-btn-orange\" onClick=\"{{next}}\">{{cur.nextLabel}} →<\/button><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- DIENSTEN -->\n<section aria-labelledby=\"dienst-title\" style=\"background:#E7F3F0\">\n<div style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,7vw,88px) max(20px,4vw)\">\n<div class=\"l-rv\" style=\"display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between;align-items:flex-end;margin-bottom:32px\"><div><h2 id=\"dienst-title\" class=\"l-h\" style=\"font-size:clamp(30px,4vw,46px)\">Onze diensten<\/h2><div class=\"l-bar\" style=\"margin-top:14px\" aria-hidden=\"true\"><\/div><\/div><p style=\"margin:0;max-width:46ch;color:#4F6260;line-height:1.6\">Binnen de vijf stappen zetten we alleen in wat nodig is. Niet iedereen heeft bijvoorbeeld taalondersteuning nodig: de stappen blijven gelijk, de invulling verschilt.<\/p><\/div>\n<div class=\"l-rv\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px\">\n<div class=\"l-card\" style=\"background:#FFFFFF\"><h3 class=\"l-h\" style=\"font-size:20px;margin-bottom:10px\">Werktaal en vaktaal<\/h3><p style=\"margin:0;line-height:1.6;color:#4F6260\">Praktisch Nederlands voor op het werk: instructies begrijpen, vragen stellen, veiligheidswoorden herkennen en begrippen uit de eigen sector gebruiken.<\/p><\/div>\n<div class=\"l-card\" style=\"background:#FFFFFF\"><h3 class=\"l-h\" style=\"font-size:20px;margin-bottom:10px\">Digitale vaardigheden<\/h3><p style=\"margin:0;line-height:1.6;color:#4F6260\">Praktisch en op het werk gericht: een rooster-app gebruiken, uren invoeren, e-mail en berichten lezen en sturen, online ziekmelden, veilig omgaan met wachtwoorden en online solliciteren.<\/p><\/div>\n<div class=\"l-card\" style=\"background:#FFFFFF\"><h3 class=\"l-h\" style=\"font-size:20px;margin-bottom:10px\">Begeleiding richting werk<\/h3><p style=\"margin:0;line-height:1.6;color:#4F6260\">Kennismaken, talenten en leerbehoeften in kaart brengen, werkgerichte doelen formuleren en oefenen met wat nodig is voor een volgende stap.<\/p><\/div>\n<div class=\"l-card\" style=\"background:#FFFFFF\"><h3 class=\"l-h\" style=\"font-size:20px;margin-bottom:10px\">Coaching van werknemer én werkgever<\/h3><p style=\"margin:0;line-height:1.6;color:#4F6260\">Ondersteuning bij verwachtingen, communicatie, samenwerking en knelpunten op de werkvloer.<\/p><\/div>\n<div class=\"l-card\" style=\"background:#FFFFFF\"><h3 class=\"l-h\" style=\"font-size:20px;margin-bottom:10px\">Begeleiding tijdens het werk<\/h3><p style=\"margin:0;line-height:1.6;color:#4F6260\">Regelmatige contactmomenten, praktische leerdoelen, evaluaties en afstemming met alle betrokkenen.<\/p><\/div>\n<div class=\"l-card\" style=\"background:#1F5D5A;color:#FFFFFF;border-color:#1F5D5A\"><h3 class=\"l-h\" style=\"font-size:20px;margin-bottom:10px;color:#FFFFFF\">Nazorg<\/h3><p style=\"margin:0;line-height:1.6;color:#D6EAE5\">Ondersteuning na de start of afronding van een traject, op basis van de afspraken die we samen maken.<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<!-- UITGANGSPUNTEN -->\n<section aria-labelledby=\"let-title\" style=\"background:#FFFFFF\">\n<div style=\"max-width:1280px;margin:0 auto;padding:clamp(64px,8vw,96px) max(20px,4vw)\">\n<div class=\"l-rv\" style=\"text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:36px\"><h2 id=\"let-title\" class=\"l-h\" style=\"font-size:clamp(30px,4vw,46px)\">Waar we op letten<\/h2><div class=\"l-bar\" aria-hidden=\"true\"><\/div><\/div>\n<div class=\"l-rv\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px\">\n<div class=\"l-card\"><span class=\"l-num\">1<\/span><h3 class=\"l-h\" style=\"font-size:20px;margin:14px 0 8px\">Mogelijkheden eerst<\/h3><p style=\"margin:0;line-height:1.6;color:#4F6260\">We beginnen bij wat iemand kan en wil, niet bij wat ontbreekt.<\/p><\/div>\n<div class=\"l-card\"><span class=\"l-num\">2<\/span><h3 class=\"l-h\" style=\"font-size:20px;margin:14px 0 8px\">Taal en digitaal in de context van werk<\/h3><p style=\"margin:0;line-height:1.6;color:#4F6260\">We oefenen met de woorden, apps en situaties van de eigen werkplek.<\/p><\/div>\n<div class=\"l-card\"><span class=\"l-num\">3<\/span><h3 class=\"l-h\" style=\"font-size:20px;margin:14px 0 8px\">Afronden is niet beheersen<\/h3><p style=\"margin:0;line-height:1.6;color:#4F6260\">Een opdracht is pas het begin. We kijken in de praktijk of een vaardigheid echt lukt.<\/p><\/div>\n<div class=\"l-card\"><span class=\"l-num\">4<\/span><h3 class=\"l-h\" style=\"font-size:20px;margin:14px 0 8px\">Iedereen weet wat gedeeld wordt<\/h3><p style=\"margin:0;line-height:1.6;color:#4F6260\">Per onderdeel is duidelijk wie het kan zien. Interne notities blijven intern.<\/p><\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<section aria-labelledby=\"ap-cta\" style=\"background:#1F5D5A;color:#FFFFFF\">\n<div style=\"max-width:1280px;margin:0 auto;padding:clamp(48px,6vw,72px) max(20px,4vw);display:flex;flex-wrap:wrap;gap:24px 48px;align-items:center;justify-content:space-between\">\n<div class=\"l-rv\"><p class=\"l-label\" style=\"margin:0 0 12px\">Voor gemeenten en werkgevers<\/p><h2 id=\"ap-cta\" class=\"l-h\" style=\"font-size:clamp(30px,4vw,44px);color:#FFFFFF\">Wat kan deze aanpak voor uw organisatie betekenen?<\/h2><div class=\"l-bar\" style=\"margin:14px 0 12px\" aria-hidden=\"true\"><\/div><p style=\"margin:0;color:#D6EAE5;line-height:1.6;max-width:52ch\">In een eerste gesprek bespreken we uw vraag, voor welke inwoners of medewerkers het is en wat er nodig is.<\/p><\/div>\n<a class=\"l-btn l-btn-orange l-rv\" href=\"contact.html\" style=\"min-height:58px;padding:0 30px;font-size:17px\">Bespreek een samenwerking <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 8h10M9 4l4 4-4 4\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/a>\n<\/div>\n<\/section>\n<\/main>\n<dc-import name=\"Footer\" hint-size=\"100%,360px\"><\/dc-import>\n<\/div>", "props": {"$preview": {"width": 1440, "height": 3900}}, "src": "\nconst STAPPEN = [\n{ n: 1, label: 'Kennismaking deelnemer', kop: 'We beginnen bij de mens, niet bij het formulier', wat: 'Een gesprek over werkervaring, wensen, talenten en wat iemand nodig heeft. We vragen alleen wat nodig is.', wie: 'Deelnemer en begeleider. Waar het past: de werkgever of de contactpersoon van de gemeente.', daarna: 'Een gedeeld beeld v
